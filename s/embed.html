<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Cheese Stash Loading...</title>
<style>
        :root {
            --primary: #ff9e00;
            --primary-dark: #e68a00;
            --primary-light: #ffb733;
            --accent: #6c5ce7;
            --accent-dark: #5a4fcf;
            --dark: #0f1521;
            --darker: #0a0e17;
            --light: #f0f4ff;
            --gray: #8a9bb8;
            --success: #00c853;
            --error: #ff5252;

            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, #ff6b00 100%);
            --gradient-dark: linear-gradient(135deg, var(--darker) 0%, #1a2b3c 100%);
            --gradient-accent: linear-gradient(135deg, var(--accent) 0%, #8b78ff 100%);

            --shadow-glow: 0 0 20px rgba(255, 158, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--gradient-dark);
            color: var(--light);
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .loader-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .cheese {
            font-size: 150px;
            position: absolute;
            color: transparent;
            -webkit-text-stroke: 3px var(--primary);
            filter: drop-shadow(0 0 10px rgba(255, 158, 0, 0.5));
            visibility: hidden;
        }

        .cheese-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .cheese-fill span {
            font-size: 150px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
        }

        .loading-text {
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 20px;
            background: linear-gradient(to right, #ff9e00, #ffcc33);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: fade 2s ease-in-out infinite;
        }

        @keyframes fade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .tips {
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--gray);
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
            padding: 0 20px;
        }

        .progress-text {
            margin-top: 10px;
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 600;
        }
    </style>
<script src="uv/uv.bundle.js" defer></script>
<script src="uv/uv.config.js" defer></script>
<script src="register-sw.js" defer></script>
<script src="embed.js" defer></script>
</head>
<body>
    <div class="loader-container">
        <div class="cheese">🧀</div>
        <div class="cheese-fill"><span>🧀</span></div>
    </div>
    <div class="loading-text">Loading The Cheese Stash...</div>
    <div class="tips">Please wait until the cheese is full!</div>

<script>
    const fill = document.querySelector('.cheese-fill');
    let progress = 0;

    // Simulate loading progress
    const interval = setInterval(() => {
        progress += 1; // increment progress
        fill.style.height = progress + '%';

        if (progress >= 100) {
            clearInterval(interval);
            document.querySelector('.loading-text').textContent = "Cheese Loaded!";
            // Optionally redirect or execute other code here
        }
    }, 50); // 50ms per increment, ~5 seconds total
</script>
</body>
</html>
