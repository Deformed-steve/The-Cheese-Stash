<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>Sub-Surface</title>

<style>
html, body, #canvas { margin:0; padding:0; border:0; }
body { background:black; overflow:hidden; touch-action:none; }
#canvas { display:block; }
#canvas:focus { outline:none; }
#status {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    background:#000; color:white;
}
</style>

<link rel="icon" type="image/png" href="Sub-Surface.icon.png" />
<link rel="apple-touch-icon" href="Sub-Surface.apple-touch-icon.png"/>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="status">
    <div id="status-notice">Preparing...</div>
    <progress id="status-progress" value="0" max="100" style="width:50%; margin-top:10px;"></progress>
</div>

<script>
(function () {
'use strict';

const BASE = "https://cdn.jsdelivr.net/gh/deformed-steve/the-cheese-stash@main/games/sub/";
const originalFetch = window.fetch;
const mergedData = {};
const pending = {};

window.fetch = function(url, ...args) {
    const u = url.toString();

    if (
        u.includes("Sub-Surface.pck") ||
        u.includes("Sub-Surface.wasm") ||
        u.includes("Sub-Surface.side.wasm")
    ) {
        const file =
            u.includes(".pck") ? "Sub-Surface.pck" :
            u.includes(".side.wasm") ? "Sub-Surface.side.wasm" :
            "Sub-Surface.wasm";

        if (mergedData[file])
            return Promise.resolve(new Response(mergedData[file]));

        return new Promise(resolve => {
            if (!pending[file]) pending[file] = [];
            pending[file].push(resolve);
        });
    }

    return originalFetch(url, ...args);
};

async function merge(name, start, end, padded) {
    const buffers = [];

    for (let i = start; i <= end; i++) {
        const part = padded ? i.toString().padStart(2, '0') : i;
        const url = BASE + encodeURIComponent(name + ".part" + part);

        const res = await originalFetch(url);
        if (!res.ok) throw new Error("Failed loading " + url);

        buffers.push(await res.arrayBuffer());

        const progress = ((i / end) * 100);
        document.getElementById("status-progress").value = progress;
        document.getElementById("status-notice").innerText =
            `Loading ${name} (${i}/${end})`;
    }

    const blob = new Blob(buffers, { type: "application/octet-stream" });
    mergedData[name] = blob;

    if (pending[name]) {
        pending[name].forEach(r => r(new Response(blob)));
        delete pending[name];
    }
}

async function init() {
    try {
        // Merge all split files
        await merge("Sub-Surface.pck", 1, 12, true);
        await merge("Sub-Surface.wasm", 1, 1, false);
        await merge("Sub-Surface.side.wasm", 1, 3, false);

        const script = document.createElement("script");
        script.src = BASE + "Sub-Surface.js";

        script.onload = () => {
            const engine = new Engine({
                args: [],
                canvasResizePolicy: 2,
                executable: "Sub-Surface",
                fileSizes: {
                    "Sub-Surface.pck": 219574468,
                    "Sub-Surface.wasm": 1588912,
                    "Sub-Surface.side.wasm": 39000000
                },
                focusCanvas: true,
                ensureCrossOriginIsolationHeaders: true
            });
// Pointer Lock Setup
const canvas = document.getElementById("canvas");

function requestPointerLock() {
    if (canvas.requestPointerLock) {
        canvas.requestPointerLock();
    }
}

function exitPointerLock() {
    if (document.exitPointerLock) {
        document.exitPointerLock();
    }
}

// Lock on click
canvas.addEventListener("click", () => {
    if (document.pointerLockElement !== canvas) {
        requestPointerLock();
    }
});

// Optional: Unlock on ESC automatically handled by browser,
// but this keeps state clean
document.addEventListener("pointerlockchange", () => {
    if (document.pointerLockElement === canvas) {
        console.log("Pointer locked");
    } else {
        console.log("Pointer unlocked");
    }
});
            engine.startGame({
                onProgress: (c, t) => {
                    if (t > 0)
                        document.getElementById("status-progress").value =
                            (c / t) * 100;
                }
            }).then(() => {
                document.getElementById("status").style.display = "none";
            });
        };

        document.body.appendChild(script);

    } catch (e) {
        document.getElementById("status-notice").innerText =
            "Load Failed - Check Console";
        console.error(e);
    }
}

init();
})();
</script>

</body>
</html>
