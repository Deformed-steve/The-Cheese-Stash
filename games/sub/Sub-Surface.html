<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Sub-Surface</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Sub-Surface.icon.png" />
<link rel="apple-touch-icon" href="Sub-Surface.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--false use-filter--true" src="Sub-Surface.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="Sub-Surface.js"></script>
<script>
(function() {
'use strict';
const BASE_JS = "https://cdn.jsdelivr.net/gh/shayderrr/portsv4@06672782de36961983b66cdf43a8c415929ac992/web/";
const BASE_PCK = "https://cdn.jsdelivr.net/gh/shayderrr/portsv4@06672782de36961983b66cdf43a8c415929ac992/web/pck/";
const originalFetch = window.fetch;
const mergedData = {};
const pendingRequests = {};

window.fetch = function(url, ...args) {
    const u = url.toString();
    if (u.includes("As Duty Demands.pck") || u.includes("As%20Duty%20Demands.pck") || u.includes("As Duty Demands.wasm") || u.includes("As%20Duty%20Demands.wasm")) {
        const f = u.includes(".pck") ? "As Duty Demands.pck" : "As Duty Demands.wasm";
        if (mergedData[f]) return Promise.resolve(new Response(mergedData[f]));
        return new Promise((resolve) => {
            if (!pendingRequests[f]) pendingRequests[f] = [];
            pendingRequests[f].push(resolve);
        });
    }
    return originalFetch(url, ...args);
};

async function merge(name, baseUrl, start, end, pad) {
    const bufs = [];
    for (let i = start; i <= end; i++) {
        const p = pad ? i.toString().padStart(2, '0') : i;
        const url = baseUrl + encodeURIComponent(name + ".part" + p);
        const r = await originalFetch(url);
        if (!r.ok) throw new Error();
        bufs.push(await r.arrayBuffer());
        
        const totalParts = 81; 
        const currentPart = name.includes('.pck') ? i : 79 + i;
        document.getElementById('status-progress').value = (currentPart / totalParts) * 100;
        document.getElementById('status-text').innerText = `Loading ${name} (Part ${i}/${end})`;
    }
    const b = new Blob(bufs, { type: 'application/octet-stream' });
    mergedData[name] = b;
    if (pendingRequests[name]) {
        pendingRequests[name].forEach(res => res(new Response(b)));
        delete pendingRequests[name];
    }
}

async function init() {
    try {
        await merge("Sub-Surface.pck", BASE_PCK, 1, 79, true);
        await merge("Sub-Surface.wasm", BASE_JS, 1, 1, false);
        
        const s = document.createElement('script');
        s.src = BASE_JS + encodeURIComponent("Sub-Surface.js");
        s.onload = () => {
            const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Sub-Surface","experimentalVK":false,"fileSizes":{"Sub-Surface.pck":1565896152,"Sub-Surface.wasm":35740641},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
            engine.startGame({
                onProgress: (c, t) => { if (t > 0) document.getElementById('status-progress').value = (c / t) * 100; }
            }).then(() => {
                document.getElementById('status').style.display = 'none';
                window.dispatchEvent(new Event('resize'));
            });
        };
        document.body.appendChild(s);
    } catch (e) {
        document.getElementById('status-text').innerText = "Load Failed - Check Connection";
    }
}
init();
})();
</script>
	</body>
</html>
