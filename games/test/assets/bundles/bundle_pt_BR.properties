tutorial.spawnWave.text = Uma horda esta vindo. DestrÃºa-os.
tutorial.pumpDesc.text = Em hordas mais avanÃ§adas, vocÃª talvez precise de [yellow]bombas[] para distribuir lÃ­quidos para geradores ou extratores.
tutorial.pumpPlace.text = Bombas trabalham de forma semelhante Ã s brocas, porÃ©m elas produzem lÃ­quidos ao envÃ©s de minÃ©rios. Tente colocar uma bomba na [yellow]cÃ©lula de petrÃ³leo designada[].
