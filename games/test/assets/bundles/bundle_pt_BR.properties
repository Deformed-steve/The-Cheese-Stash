tutorial.placeTurret.text = Agora, selecione e construa uma [yellow]torre[] no [yellow]local marcado[].
tutorial.placedTurretAmmo.text = Esta torre aceitarÃ¡ [yellow]muniÃ§Ã£o[] da esteira. VocÃª pode ver quanta muniÃ§Ã£o elas tem passando o mouse sobre elas e verificando a [green]barra verde[].
tutorial.turretExplanation.text = As torres irÃ£o atirar no inimigo mais prÃ³ximo que estiver ao alcance, contanto que tenham muniÃ§Ã£o suficiente.
tutorial.waves.text = A cada [yellow]60[] segundos, uma horda de [coral]inimigos[] irÃ¡ aparecer em locais especÃ­ficos e tentarÃ¡ destruir o nÃºcleo.
tutorial.coreDestruction.text = Seu objetivo Ã© [yellow]defender o nÃºcleo[]. Se o nÃºcleo for destruÃ­do, vecÃª [coral]perde o jogo[].
tutorial.pausingDesktop.text = Se vocÃª precisar parar por alguns instantes, aperte o [orange]botÃ£o de pausa[] no canto superior esquerdo ou [orange]barra de espaÃ§o[] para pausar o jogo. VocÃª pode colocar blocos enquanto o jogo esta pausado, porÃ©m nÃ£o poderÃ¡ se mover ou atirar.
