tutorial.drillPlaced.text = A broca produzirÃ¡ [yellow]pedra[], direcionando o produzido para a esteira a qual moverÃ¡ a pedra para o [yellow]nÃºcleo[].
tutorial.drillInfo.text = MinÃ©rios diferentes precisam de diferentes brocas. Pedra precisam de brocas de pedra, Ferro de brocas de ferro, etc.
tutorial.drillPlaced2.text = Itens movidos para o nÃºcleo sÃ£o colocados em seu [yellow]inventÃ¡rio[], no canto superior esquerdo. Colocar blocos gasta os recursos do inventÃ¡rio.
