tutorial.intro.text = [yellow]Bem-vindo ao tutorial.[] Para comeÃ§ar aperte 'prÃ³ximo'.
tutorial.moveDesktop.text = Para mover, use as teclas [orange][[WASD][]. Segure [orange]shift[] para mover rÃ¡pido. Segure [orange]CTRL[] enquanto usa a [orange]roda do mouse[] para aumentar ou diminuir o zoom.
tutorial.shoot.text = Use your mouse to aim,  hold [orange]left mouse button[] to shoot. Try practicing on the [yellow]target[].
tutorial.moveAndroid.text = Para arrastar a visÃ£o, passe um dedo pela tela. Pince com os dedos para aumentar ou diminuir o zoom.
tutorial.placeSelect.text = Tente selecionar uma [yellow]esteira[] do menu de blocos no canto inferior direito.
tutorial.placeConveyorDesktop.text = Use a [orange][[roda do mouse][] para girar a esteira atÃ© que aponte [orange]para frente[], entÃ£o coloque-a no [yellow]local marcado[]  usando o [orange][[botÃ£o esquerdo do mouse][].
tutorial.placeConveyorAndroid.text = Use o [orange][[botÃ£o de girar][] para girar a esteira para que aponte [orange]para frente[], arraste-a para a posiÃ§Ã£o e entÃ£o coloque-a na [yellow]posiÃ§Ã£o marcada[] usando o [orange][[botÃ£o de confirmaÃ§Ã£o][].
tutorial.placeConveyorAndroidInfo.text = VocÃª tambÃ©m pode apertar no Ã­cone com uma cruz no canto inferior esquerdo para alterar para o [orange][[modo de toque][], e colocar blocos apertando na tela. No modo de toque, blocos podem ser girados com a seta no canto inferior esquerdo. Aperte [yellow]prÃ³ximo[] para tentar.
tutorial.placeDrill.text = Agora selecione e coloque uma [yellow]broca de pedra[] no local marcado.
tutorial.blockInfo.text = Se quiser saber mais sobre os blocos, vocÃª pode apertar o [orange]sÃ­mbolo de interrogaÃ§Ã£o[] no canto superior direito para ler mais.
tutorial.deselectDesktop.text = VocÃª pode cancelar a seleÃ§Ã£o de um bloco usando o [orange][botÃ£o direito do mouse[].
