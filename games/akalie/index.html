<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Friday Night Funkin': Psych Engine</title>


  <base href="https://cdn.jsdelivr.net/gh/deformed-steve/The-Cheese-Stash@main/games/akalie/">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="shortcut icon" type="image/png" href="favicon.png">


  <script src="PsychEngine.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #openfl-content {
      width: 100%;
      height: 100%;
      background: #000;
    }

    @font-face {
      font-family: 'Pixel Arial 11 Bold';
      src: url('assets/fonts/pixel.woff') format('woff');
    }

    @font-face {
      font-family: 'Paper Cuts 2';
      src: url('assets/fonts/vcr.woff') format('woff');
    }

    @font-face {
      font-family: 'Nokia Cellphone FC Small';
      src: url('flixel/fonts/nokiafc22.woff') format('woff');
    }

    @font-face {
      font-family: 'Monsterrat';
      src: url('flixel/fonts/monsterrat.woff') format('woff');
    }
  </style>
</head>

<body>
  <noscript>
    This game requires JavaScript to run.
  </noscript>

  <div id="openfl-content"></div>

  <script>

    window.addEventListener("touchmove", e => e.preventDefault(), {
      passive: false
    });

   
    if (window.devicePixelRatio && window.devicePixelRatio > 2) {
      document
        .querySelector("meta[name=viewport]")
        .setAttribute(
          "content",
          "width=device-width, initial-scale=" + (2 / window.devicePixelRatio)
        );
    }

 
    lime.embed("PsychEngine", "openfl-content", 1280, 720, {
      parameters: {}
    });
  </script>

  <link rel="stylesheet" href="assets/css.css">
  <script src="js.js"></script>
</body>
</html>
