<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cheese Proxy | Enhanced New Tab</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    :root {
      --cheese-yellow: #FFB347;
      --cheese-orange: #FF9800;
      --cheese-dark: #8B4513;
      --cheese-holes: #FFD700;
      --cheese-crust: #D2691E;
      --bg-dark: #1A1200;
      --bg-mid: #3D2C1A;
      --text-light: #FFF8DC;
      --text-accent: #FFD700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka One', 'Poppins', sans-serif;
      color: var(--text-light);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-dark) 70%);
      text-align: center;
      position: relative;
    }

    /* Cheese Slice Background */
    .cheese-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      opacity: 0.15;
      background-image: 
        radial-gradient(circle at 20% 30%, var(--cheese-holes) 2%, transparent 2.5%),
        radial-gradient(circle at 60% 70%, var(--cheese-holes) 3%, transparent 3.5%),
        radial-gradient(circle at 40% 50%, var(--cheese-holes) 2%, transparent 2.5%),
        radial-gradient(circle at 80% 20%, var(--cheese-holes) 1.5%, transparent 2%),
        radial-gradient(circle at 30% 80%, var(--cheese-holes) 2.5%, transparent 3%),
        radial-gradient(circle at 70% 40%, var(--cheese-holes) 2%, transparent 2.5%);
      background-size: 200px 200px;
    }

    /* Hidden particles container */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      opacity: 0;
      pointer-events: none;
    }

    /* Main container with cheese-like border */
    .cheese-container {
      background: linear-gradient(145deg, var(--cheese-yellow), var(--cheese-orange));
      border-radius: 20px;
      padding: 2.5rem 3rem;
      margin: 1rem;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.5),
        0 0 0 8px var(--cheese-crust),
        inset 0 0 15px rgba(255, 255, 255, 0.3);
      position: relative;
      max-width: 800px;
      border: 5px dotted var(--cheese-dark);
    }

    /* Cheese holes as decorative elements */
    .cheese-hole {
      position: absolute;
      background-color: var(--cheese-holes);
      border-radius: 50%;
      opacity: 0.7;
    }
    .hole-1 { width: 40px; height: 40px; top: 30px; left: 40px; }
    .hole-2 { width: 25px; height: 25px; bottom: 50px; right: 60px; }
    .hole-3 { width: 35px; height: 35px; top: 60px; right: 50px; }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      color: var(--cheese-dark);
      text-shadow: 3px 3px 0px rgba(139, 69, 19, 0.3);
      letter-spacing: 1.5px;
      background: linear-gradient(to bottom, var(--cheese-dark), #5a2d0c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: var(--text-accent);
      font-weight: 300;
      letter-spacing: 1px;
    }

    .time-display {
      font-size: 4.5rem;
      margin: 1rem 0;
      color: var(--cheese-dark);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      background-color: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1.5rem;
      border-radius: 15px;
      display: inline-block;
      backdrop-filter: blur(5px);
      border: 2px solid rgba(255, 152, 0, 0.3);
    }

    .date-display {
      font-size: 1.8rem;
      margin: 0.5rem 0 2rem;
      color: var(--cheese-crust);
      font-weight: 600;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* Quick links section */
    .quick-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .cheese-link {
      background: var(--cheese-dark);
      color: var(--text-light);
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      border: 2px solid var(--cheese-crust);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cheese-link:hover {
      transform: translateY(-5px);
      background: var(--cheese-crust);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .cheese-link i {
      font-size: 1.2rem;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 1rem;
      color: var(--text-accent);
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
    }

    /* Mouse follower cheese cursor */
    .cheese-cursor {
      position: fixed;
      width: 30px;
      height: 30px;
      pointer-events: none;
      z-index: 9999;
      background-image: radial-gradient(circle, var(--cheese-yellow) 30%, var(--cheese-orange) 70%);
      border-radius: 50%;
      opacity: 0.7;
      mix-blend-mode: difference;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
    }

    /* Animation for the cheese container */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .cheese-container {
      animation: float 6s ease-in-out infinite;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      .time-display { font-size: 3.5rem; }
      .date-display { font-size: 1.5rem; }
      .cheese-container { padding: 2rem 1.5rem; margin: 1rem; }
      .quick-links { gap: 1rem; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Hidden particles container -->
  <div id="particles-js"></div>
  
  <!-- Cheese pattern background -->
  <div class="cheese-background"></div>
  
  <!-- Cheese cursor follower -->
  <div class="cheese-cursor" id="cheeseCursor"></div>

  <!-- Main cheese container -->
  <div class="cheese-container">
    <!-- Decorative cheese holes -->
    <div class="cheese-hole hole-1"></div>
    <div class="cheese-hole hole-2"></div>
    <div class="cheese-hole hole-3"></div>
    
    <h1>Cheese Proxy</h1>
    <p class="tagline">The cheesiest way to browse the web!</p>
    
    <div class="time-display" id="time">--:--:--</div>
    <div class="date-display" id="date">Loading date...</div>
    
    <div class="quick-links">
      <a href="Portfolio.html" class="cheese-link"><i class="fas fa-envelope"></i> Portfolio</a>
    </div>
  </div>

  <footer>New Tab</footer>

  <script>
    // Time & Date Update
    function updateTime() {
      const now = new Date();
      const pad = n => n.toString().padStart(2,'0');
      document.getElementById('time').textContent = 
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      
      const options = { 
        weekday: 'long', 
        month: 'long', 
        day: 'numeric', 
        year: 'numeric' 
      };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }
    
    updateTime();
    setInterval(updateTime, 1000);

    // Hidden particles initialization (completely invisible)
    particlesJS("particles-js", {
      particles: {
        number: { value: 0, density: { enable: true, value_area: 800 } },
        color: { value: ["#ff9800"] },
        opacity: { value: 0 },
        size: { value: 0 },
        line_linked: { enable: false },
        move: { enable: false }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onhover: { enable: false }, onclick: { enable: false }, resize: false }
      }
    });

    // Cheese cursor follower
    document.addEventListener('mousemove', (e) => {
      const cursor = document.getElementById('cheeseCursor');
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // Add click effect to cheese links
    document.querySelectorAll('.cheese-link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        
        // Create a cheese particle effect on click
        for(let i = 0; i < 8; i++) {
          setTimeout(() => {
            const particle = document.createElement('div');
            particle.className = 'cheese-hole';
            particle.style.position = 'fixed';
            particle.style.width = '15px';
            particle.style.height = '15px';
            particle.style.left = e.clientX + 'px';
            particle.style.top = e.clientY + 'px';
            particle.style.zIndex = '9998';
            particle.style.pointerEvents = 'none';
            particle.style.transition = 'all 0.5s ease';
            
            document.body.appendChild(particle);
            
            // Animate particle
            setTimeout(() => {
              const angle = Math.random() * Math.PI * 2;
              const distance = 50 + Math.random() * 100;
              const x = e.clientX + Math.cos(angle) * distance;
              const y = e.clientY + Math.sin(angle) * distance;
              
              particle.style.left = x + 'px';
              particle.style.top = y + 'px';
              particle.style.opacity = '0';
              particle.style.transform = 'scale(0.5)';
            }, 10);
            
            // Remove particle after animation
            setTimeout(() => {
              if (particle.parentNode) {
                particle.parentNode.removeChild(particle);
              }
            }, 600);
          }, i * 50);
        }
      });
    });
  </script>
</body>
</html>
