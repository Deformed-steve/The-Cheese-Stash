<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="banner.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SJ zxs</title>
  <style>
    :root {
      --bg: #0e1b14;
      --secondary-bg: #1a2f25;
      --third-bg: #244f36;
      --fourth-bg: #1a3a2a;
      --primary: #9e830a;
      --secondary: #000000;
      --text-color: #e6f7ea;
      --button-bg: #e0b320;
      --button-hover: #7e5303;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text-color);
      background: linear-gradient(135deg, var(--bg) 0%, var(--secondary-bg) 40%, var(--third-bg) 100%);
      background-size: 200% 200%;
      animation: gradientShift 30s ease infinite;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }


#particles-js {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

/* Make browser semi-transparent so particles show through */
.browser-container {
  background: rgba(30, 30, 30, 0.7);
  border-radius: 12px;
  margin: 1rem;
  overflow: hidden;
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* Nav buttons glow on hover */
.nav button {
  box-shadow: 0 0 5px rgba(255,152,0,0.3);
  transition: all 0.3s ease;
}

.nav button:hover {
  box-shadow: 0 0 15px rgba(255,152,0,0.6);
}

/* Address bar */
.bar {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,0.2);
}

.bar:focus {
  box-shadow: 0 0 10px rgba(255,152,0,0.6);
  border-color: var(--primary);
}


    .browser-container {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.8rem;
      height: 58px;
      background: rgba(0,0,0,0.08);
    }

    .nav button {
      color: var(--text-color);
      background: var(--button-bg);
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-size: 1.05rem;
      transition: transform 0.2s ease, background 0.2s ease;
      min-width: 44px;
      height: 40px;
    }
    .nav button:hover { background: var(--button-hover); transform: translateY(-1px); }

    .bar {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
      background: var(--button-bg);
      color: var(--text-color);
      font-size: 1.0rem;
    }
    .bar:focus { background: var(--button-hover); }

    .iframe-container {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      background: #fff;
      animation: fadeIn 0.5s ease both;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<body>
  <div id="particles-js"></div>
  <div class="browser-container">
    <div class="nav">
      <button onclick="goBack()">⟵</button>
      <button onclick="goForward()">⟶</button>
      <button onclick="reloadFrame()">⟳</button>
      <input class="bar" id="address-bar" autocomplete="off" placeholder="Enter URL or search"
        onkeyup="event.keyCode === 13 && handleSubmit()" />
    </div>
    <div class="iframe-container">
      <iframe id="uv-frame" src="/assets/pages/newtab.html"></iframe>
    </div>
  </div>

<nav class="side-nav right-nav">
  <a href="/index.html" class="nav-icon" title="Games">
    <img src="/icons/games.svg" alt="Games">
  </a>
  <a href="/a.html" class="nav-icon" title="Apps">
    <img src="/icons/apps.svg" alt="Apps">
  </a>
  <a href="/apps/browser/browse.html" class="nav-icon" title="Browse">
    <img src="/icons/browse.svg" alt="Browse">
  </a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <script>
    const iframe = document.getElementById("uv-frame");
    const addressBar = document.getElementById("address-bar");

    function handleSubmit() {
      let url = addressBar.value.trim();
      if (!url) return;

      // Detect search vs URL
      if (!url.startsWith("http") && !url.includes(".")) {
        url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
      } else if (!url.startsWith("http")) {
        url = "https://" + url;
      }

      iframe.src = "/s/embed.html#" + url;
    }

    function reloadFrame() {
      iframe.src = iframe.src;
    }

    function goBack() {
      iframe.contentWindow.history.back();
    }

    function goForward() {
      iframe.contentWindow.history.forward();
    }
  </script>
  <script>
particlesJS("particles-js", {
  particles: {
    number: { value: 80, density: { enable: true, value_area: 800 } },
    color: { value: ["#ff9800", "#4caf50", "#ffffff"] },
    shape: { type: ["circle", "triangle", "polygon"], stroke: { width: 0 }, polygon: { nb_sides: 6 } },
    opacity: { value: 0.5, random: true, anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false } },
    size: { value: 3, random: true, anim: { enable: true, speed: 4, size_min: 0.3, sync: false } },
    line_linked: { enable: true, distance: 150, color: "#ff9800", opacity: 0.2, width: 1 },
    move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
  },
  interactivity: {
    detect_on: "canvas",
    events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true },
    modes: { grab: { distance: 140, line_linked: { opacity: 0.5 } }, push: { particles_nb: 4 } }
  },
  retina_detect: true
});
</script>

</body>
</html>
