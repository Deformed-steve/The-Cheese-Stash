<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini AI Chat</title>
<script src="https://cdn.jsdelivr.net/gh/Deformed-steve/super-duper-happiness@main/sigma.js"></script>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .msg {
    margin: 8px 0;
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 80%;
    word-wrap: break-word;
  }
  .user { background: #333; align-self: flex-end; }
  .ai { background: #1a1a1a; align-self: flex-start; }
  #bar {
    display: flex;
    padding: 10px;
    background: #000;
  }
  input {
    flex: 1;
    background: #222;
    border: none;
    color: white;
    padding: 10px;
    border-radius: 8px;
    outline: none;
  }
  button {
    margin-left: 10px;
    background: #444;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #555; }
</style>
</head>
<body>
  <div id="chat"></div>
  <div id="bar">
    <input id="prompt" placeholder="Type a message..." />
    <button onclick="send()">Send</button>
  </div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("prompt");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const prompt = input.value.trim();
  if (!prompt) return;
  addMessage(prompt, "user");
  input.value = "";

  try {
    const response = await puter.ai.chat(prompt, { model: "gpt-5-nano" });
    addMessage(response, "ai");
  } catch (err) {
    addMessage("Error: " + err, "ai");
  }
}
</script>
</body>
</html>
