<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser - The Cheese Stash</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff9e00;
            --primary-dark: #e68a00;
            --primary-light: #ffb733;
            --accent: #6c5ce7;
            --accent-dark: #5a4fcf;
            --dark: #0f1521;
            --darker: #0a0e17;
            --dark-card: #1a2236;
            --dark-card-hover: #212b43;
            --light: #f0f4ff;
            --gray: #8a9bb8;
            --gray-dark: #4a5568;

            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, #ff6b00 100%);
            --gradient-dark: linear-gradient(135deg, var(--darker) 0%, #1a2b3c 100%);
            --gradient-accent: linear-gradient(135deg, var(--accent) 0%, #8b78ff 100%);

            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.25);
            --shadow-glow: 0 0 20px rgba(255, 158, 0, 0.3);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--gradient-dark);
            color: var(--light);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 158, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(108, 92, 231, 0.05) 0%, transparent 50%);
            z-index: -2;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .browser-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background: rgba(26, 34, 54, 0.7);
            backdrop-filter: blur(10px);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem;
            height: 70px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav button {
            color: var(--light);
            background: var(--dark-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 0.7rem 1.2rem;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            min-width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav button:hover {
            background: var(--dark-card-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .bar {
            flex: 1;
            min-width: 0;
            height: 50px;
            padding: 0 1.2rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .bar:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: var(--shadow-glow);
        }

        .bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .iframe-container {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.1);
        }

        .iframe-container iframe {
            position: absolute;
            top: 1rem;
            left: 1rem;
            width: calc(100% - 2rem);
            height: calc(100% - 2rem);
            border: none;
            border-radius: var(--radius-lg);
            background: #fff;
            animation: fadeIn 0.5s ease both;
            box-shadow: var(--shadow-lg);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Side Navigation */
        .side-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(26, 34, 54, 0.8);
            backdrop-filter: blur(10px);
            padding: 18px 12px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            box-shadow: var(--shadow-md);
            transition: var(--transition-medium);
        }

        .side-nav.right-nav {
            right: 25px;
            left: auto;
        }

        .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition-medium);
            text-decoration: none;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
        }

        .nav-icon:hover {
            color: var(--primary);
            background: rgba(255, 158, 0, 0.1);
            transform: translateY(-5px) scale(1.05);
            border-color: rgba(255, 158, 0, 0.2);
        }

        .nav-icon img {
            width: 30px;
            height: 30px;
            filter: brightness(0.9);
            transition: var(--transition-medium);
        }

        .nav-icon:hover img {
            filter: brightness(1.2);
            transform: scale(1.1);
        }

        .nav-tooltip {
            position: absolute;
            right: 70px;
            background: var(--dark-card);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-fast);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow-sm);
        }

        .nav-icon:hover .nav-tooltip {
            opacity: 1;
            visibility: visible;
            right: 65px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .side-nav {
                bottom: 20px;
                top: auto;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
                width: auto;
                padding: 15px 20px;
            }

            .side-nav.right-nav {
                right: auto;
            }

            .nav-tooltip {
                display: none;
            }

            .nav {
                padding: 0.8rem;
                gap: 0.6rem;
            }

            .nav button {
                padding: 0.6rem 1rem;
                min-width: 45px;
                height: 45px;
                font-size: 1rem;
            }

            .bar {
                height: 45px;
                padding: 0 1rem;
            }

            .iframe-container {
                padding: 0.8rem;
            }

            .iframe-container iframe {
                top: 0.8rem;
                left: 0.8rem;
                width: calc(100% - 1.6rem);
                height: calc(100% - 1.6rem);
            }
        }
    </style>
</head>

<body>
    <div id="particles-js"></div>
    <div class="browser-container">
        <div class="nav">
            <button onclick="goBack()" title="Back"><i class="fas fa-arrow-left"></i></button>
            <button onclick="goForward()" title="Forward"><i class="fas fa-arrow-right"></i></button>
            <button onclick="reloadFrame()" title="Reload"><i class="fas fa-redo"></i></button>
            <input class="bar" id="address-bar" autocomplete="off" placeholder="Enter URL or search"
                onkeyup="event.keyCode === 13 && handleSubmit()" />
        </div>
        <div class="iframe-container">
            <iframe id="uv-frame" src="/assets/pages/newtab.html"></iframe>
        </div>
    </div>

    <nav class="side-nav right-nav">
        <a href="/index.html" class="nav-icon" title="Games">
            <img src="/icons/games.svg" alt="Games">
            <span class="nav-tooltip">Games</span>
        </a>
        <a href="/a.html" class="nav-icon" title="Apps">
            <img src="/icons/apps.svg" alt="Apps">
            <span class="nav-tooltip">Apps</span>
        </a>
        <a href="/apps/browser/browse.html" class="nav-icon" title="Browse">
            <img src="/icons/browse.svg" alt="Browse">
            <span class="nav-tooltip">Browser</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        const iframe = document.getElementById("uv-frame");
        const addressBar = document.getElementById("address-bar");

        function handleSubmit() {
            let url = addressBar.value.trim();
            if (!url) return;

            // Detect search vs URL
            if (!url.startsWith("http") && !url.includes(".")) {
                url = "https://search.brave.com/search?q=" + encodeURIComponent(url);
            } else if (!url.startsWith("http")) {
                url = "https://" + url;
            }

            iframe.src = "/s/embed.html#" + url;
        }

        function reloadFrame() {
            iframe.src = iframe.src;
        }

        function goBack() {
            iframe.contentWindow.history.back();
        }

        function goForward() {
            iframe.contentWindow.history.forward();
        }

        // Initialize particles.js with the same settings as the games page
        particlesJS("particles-js", {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 1000 } },
                color: { value: ["#ff9e00", "#6c5ce7", "#4caf50", "#ff6b00"] },
                shape: { type: "circle", stroke: { width: 0 } },
                opacity: { value: 0.5, random: true, anim: { enable: true, speed: 1, opacity_min: 0.2, sync: false } },
                size: { value: 3, random: true, anim: { enable: true, speed: 4, size_min: 0.3, sync: false } },
                line_linked: { enable: true, distance: 150, color: "#ff9e00", opacity: 0.2, width: 1 },
                move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
            },
            interactivity: {
                detect_on: "canvas",
                events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true },
                modes: { grab: { distance: 140, line_linked: { opacity: 0.5 } }, push: { particles_nb: 4 } }
            },
            retina_detect: true
        });
    </script>
</body>
</html>
