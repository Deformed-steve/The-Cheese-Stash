                                        <span>${memberName}</span>
                                    </div>
                                    <span style="color:${isOnline ? '#3ba55c' : '#72767d'}; font-size:12px;">
                                        ${isOnline ? '🟢 Online' : '⚫ Offline'}
                                    </span>
                                </div>
                            `;
                            membersList.appendChild(memberDiv);
                            
                            if(isOnline) onlineCount++;
                        });
                        
                        if(onlineCount < 2) {
                            membersList.innerHTML += `<div style="color:#ed4245; text-align:center; padding:10px;">Need at least 2 online members (${onlineCount} online)</div>`;
                        }
                        
                        modal.style.display = 'flex';
                    };

                    window.dcStartGroupCall = async () => {
                        const chat = ds.chats[ds.activeChat];
                        if(!chat || chat.type !== 'group') {
                            alert('Can only start group calls in groups');
                            return;
                        }
                        
                        if(chat.members.length < 2) {
                            alert('Group needs at least 2 members');
                            return;
                        }
                        
                        const callId = 'groupcall_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        
                        try {
                            ds.localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: false});
                        } catch(e) {
                            console.error('❌ Error getting microphone:', e);
                            alert('Could not access microphone. Group call requires audio.');
                            return;
                        }
                        
                        ds.groupCall = {
                            id: callId,
                            groupId: chat.id,
                            participants: [ds.peer.id],
                            connections: {},
                            streams: {}
                        };
                        
                        const unavailableMembers = [];
                        chat.members.forEach(memberId => {
                            if(memberId !== ds.peer.id) {
                                if(ds.connections[memberId]) {
                                    ds.connections[memberId].send({
                                        type: 'group_call_invite',
                                        callId: callId,
                                        groupId: chat.id,
                                        groupName: chat.name,
                                        callerName: ds.me.name,
                                        participants: chat.members
                                    });
                                } else {
                                    unavailableMembers.push(memberId);
                                }
                            }
                        });
                        
                        if(unavailableMembers.length > 0) {
                            console.log('⚠️ Some members unavailable:', unavailableMembers);
                        }
                        
                        enterGroupCallUI(chat);
                        document.getElementById('dc-group-call-modal').style.display = 'none';
                        
                        chat.msgs.push({
                            sender: ds.peer.id,
                            name: ds.me.name,
                            avatar: ds.me.avatar,
                            text: '📞 Started a group call',
                            time: new Date().toLocaleTimeString()
                        });
                        
                        if(ds.activeChat === chat.id) {
                            renderChat();
                        }
                    };

                    window.dcAcceptGroupCall = async () => {
                        if(!ds.pendingGroupCall) return;
                        
                        const popup = document.getElementById('dc-group-call-popup');
                        if(popup) popup.style.display = 'none';
                        
                        try {
                            ds.localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: false});
                        } catch(e) {
                            console.error('❌ Error getting microphone:', e);
                            alert('Could not access microphone');
                            return;
                        }
                        
                        ds.groupCall = {
                            id: ds.pendingGroupCall.callId,
                            groupId: ds.pendingGroupCall.groupId,
                            participants: [ds.peer.id],
                            connections: {},
                            streams: {}
                        };
                        
                        if(ds.connections[ds.pendingGroupCall.fromPeer]) {
                            ds.connections[ds.pendingGroupCall.fromPeer].send({
                                type: 'group_call_accept',
                                callId: ds.pendingGroupCall.callId,
                                participantId: ds.peer.id,
                                participantName: ds.me.name
                            });
                        }
                        
                        const call = ds.peer.call(ds.pendingGroupCall.fromPeer, ds.localStream);
                        ds.groupCall.connections[ds.pendingGroupCall.fromPeer] = call;
                        
                        call.on('stream', (stream) => {
                            ds.groupCall.streams[ds.pendingGroupCall.fromPeer] = stream;
                            ds.groupCall.participants.push(ds.pendingGroupCall.fromPeer);
                            updateGroupCallUI();
                        });
                        
                        const groupChat = ds.chats[ds.pendingGroupCall.groupId];
                        if(groupChat) {
                            groupChat.members.forEach(memberId => {
                                if(memberId !== ds.peer.id && 
                                   memberId !== ds.pendingGroupCall.fromPeer && 
                                   ds.connections[memberId]) {
                                    ds.connections[memberId].send({
                                        type: 'group_call_participant_joined',
                                        callId: ds.pendingGroupCall.callId,
                                        participantId: ds.peer.id,
                                        participantName: ds.me.name
                                    });
                                    
                                    const memberCall = ds.peer.call(memberId, ds.localStream);
                                    ds.groupCall.connections[memberId] = memberCall;
                                    
                                    memberCall.on('stream', (stream) => {
                                        ds.groupCall.streams[memberId] = stream;
                                        if(!ds.groupCall.participants.includes(memberId)) {
                                            ds.groupCall.participants.push(memberId);
                                        }
                                        updateGroupCallUI();
                                    });
                                }
                            });
                        }
                        
                        enterGroupCallUI(groupChat);
                        ds.pendingGroupCall = null;
                    };

                    window.dcRejectGroupCall = () => {
                        if(!ds.pendingGroupCall) return;
                        
                        const popup = document.getElementById('dc-group-call-popup');
                        if(popup) popup.style.display = 'none';
                        
                        if(ds.connections[ds.pendingGroupCall.fromPeer]) {
                            ds.connections[ds.pendingGroupCall.fromPeer].send({
                                type: 'group_call_reject',
                                callId: ds.pendingGroupCall.callId
                            });
                        }
                        
                        ds.pendingGroupCall = null;
                    };

                    function enterGroupCallUI(chat) {
                        ds.callState = 'group_call';
                        document.getElementById('dc-call-ui').style.display = 'flex';
                        
                        document.getElementById('dc-header-name').innerText = `${chat.name} (Group Call)`;
                        
                        const callGrid = document.getElementById('dc-call-grid');
                        callGrid.innerHTML = '';
                        
                        const localUser = document.createElement('div');
                        localUser.className = 'dc-call-user';
                        localUser.id = 'dc-group-call-local';
                        localUser.innerHTML = `
                            <div class="dc-call-avatar" id="dc-group-call-av-local">
                                ${ds.me.avatar ? `<img src="${ds.me.avatar}">` : ''}
                            </div>
                            <b>${ds.me.name} (You)</b>
                            <div class="dc-status-dot" style="background:#3ba55c;"></div>
                        `;
                        if(!ds.me.avatar) {
                            document.getElementById('dc-group-call-av-local').style.background = ds.me.color;
                        }
                        callGrid.appendChild(localUser);
                        
                        ds.groupCallUIUpdate = setInterval(updateGroupCallUI, 1000);
                        
                        document.getElementById('btn-hangup').innerText = '👥 End Group Call';
                    };

                    function updateGroupCallUI() {
                        if(!ds.groupCall) return;
                        
                        const callGrid = document.getElementById('dc-call-grid');
                        
                        const localUser = document.getElementById('dc-group-call-local');
                        if(!localUser) return;
                        
                        const oldParticipants = Array.from(callGrid.children).filter(child => child.id !== 'dc-group-call-local');
                        oldParticipants.forEach(child => child.remove());
                        
                        ds.groupCall.participants.forEach(participantId => {
                            if(participantId === ds.peer.id) return;
                            
                            const chat = Object.values(ds.chats).find(c => 
                                c.type === 'dm' && c.members.includes(participantId)
                            );
                            const name = chat ? chat.name : `User_${participantId.substring(0, 4)}`;
                            const color = chat ? chat.color : '#7289da';
                            const avatar = chat ? chat.avatar : '';
                            
                            const participantDiv = document.createElement('div');
                            participantDiv.className = 'dc-call-user';
                            participantDiv.id = `dc-group-call-${participantId}`;
                            
                            const avatarContent = avatar ? 
                                `<img src="${avatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` :
                                '';
                            
                            participantDiv.innerHTML = `
                                <div class="dc-call-avatar" id="dc-group-call-av-${participantId}" style="background:${color};">
                                    ${avatarContent}
                                </div>
                                <b>${name}</b>
                                <div class="dc-status-dot" style="background:#3ba55c;"></div>
                            `;
                            
                            if(ds.groupCall.streams[participantId]) {
                                const video = document.createElement('video');
                                video.className = 'dc-video-feed';
                                video.autoplay = true;
                                video.muted = false;
                                video.srcObject = ds.groupCall.streams[participantId];
                                participantDiv.appendChild(video);
                                
                                video.play().catch(e => console.log('Video play error:', e));
                            }
                            
                            callGrid.appendChild(participantDiv);
                        });
                        
                        const participantCount = ds.groupCall.participants.length;
                        document.getElementById('dc-header-name').innerText = 
                            `Group Call (${participantCount} ${participantCount === 1 ? 'person' : 'people'})`;
                    };

                    window.dcEndGroupCall = () => {
                        if(!ds.groupCall) return;
                        
                        Object.keys(ds.groupCall.connections).forEach(peerId => {
                            if(ds.connections[peerId]) {
                                ds.connections[peerId].send({
                                    type: 'group_call_hangup',
                                    callId: ds.groupCall.id
                                });
                            }
                            if(ds.groupCall.connections[peerId]) {
                                ds.groupCall.connections[peerId].close();
                            }
                        });
                        
                        if(ds.groupCallUIUpdate) {
                            clearInterval(ds.groupCallUIUpdate);
                            ds.groupCallUIUpdate = null;
                        }
                        
                        ds.groupCall = null;
                        ds.callState = 'idle';
                        document.getElementById('dc-call-ui').style.display = 'none';
                        
                        if(ds.localStream) {
                            ds.localStream.getTracks().forEach(t => t.stop());
                            ds.localStream = null;
                        }
                        
                        document.getElementById('btn-hangup').innerText = '📞';
                    };

                    window.dcHangup = () => {
                        if(ds.groupCall) {
                            window.dcEndGroupCall();
                        } else if(ds.callPartner && ds.connections[ds.callPartner]) {
                            ds.connections[ds.callPartner].send({type: 'hangup'});
                            resetCallUI();
                        }
                    };

                    function resetCallUI() {
                        ds.callState = 'idle';
                        ds.callPartner = null;
                        document.getElementById('dc-call-ui').style.display = 'none';
                        document.getElementById('dc-vid-local').srcObject = null;
                        document.getElementById('dc-vid-remote').srcObject = null;
                        document.getElementById('dc-watch-overlay').style.display = 'none';
                        
                        if(ds.localStream) {
                            ds.localStream.getTracks().forEach(t => t.stop());
                            ds.localStream = null;
                        }
                        
                        if(ds.mediaConn) {
                            ds.mediaConn.close();
                            ds.mediaConn = null;
                        }
                        
                        document.getElementById('btn-cam').classList.remove('active');
                        document.getElementById('btn-scr').classList.remove('active');
                        document.getElementById('btn-mic').classList.remove('danger');
                        document.getElementById('btn-deaf').classList.remove('danger');
                        document.getElementById('btn-hangup').innerText = '📞';
                    }

                    // --- IN-CALL CONTROLS ---

                    window.dcToggleMic = () => {
                        if(ds.localStream) {
                            const tracks = ds.localStream.getAudioTracks();
                            if(tracks.length > 0) {
                                const enabled = !tracks[0].enabled;
                                tracks.forEach(track => track.enabled = enabled);
                                const btn = document.getElementById('btn-mic');
                                btn.classList.toggle('danger', !enabled);
                                btn.textContent = enabled ? '🎙️' : '🚫';
                            }
                        }
                    };
                    
                    window.dcToggleDeafen = () => {
                        const btn = document.getElementById('btn-deaf');
                        const isDeafened = !btn.classList.contains('danger');
                        btn.classList.toggle('danger', isDeafened);
                        btn.textContent = isDeafened ? '🔇' : '🎧';
                    };

                    window.dcToggleCam = async () => {
                        const btn = document.getElementById('btn-cam');
                        
                        if(ds.camStream) {
                            ds.camStream.getTracks().forEach(t => t.stop());
                            ds.camStream = null;
                            if(ds.camConn) {
                                ds.camConn.close();
                                ds.camConn = null;
                            }
                            document.getElementById('dc-vid-local').style.display = 'none';
                            btn.classList.remove('active');
                            
                            if(ds.callPartner && ds.connections[ds.callPartner]) {
                                ds.connections[ds.callPartner].send({type: 'stream_stop'});
                            }
                        } else {
                            try {
                                ds.camStream = await navigator.mediaDevices.getUserMedia({video: true});
                                const vid = document.getElementById('dc-vid-local');
                                vid.style.display = 'block';
                                vid.srcObject = ds.camStream;
                                
                                if(ds.callPartner) {
                                    ds.camConn = ds.peer.call(ds.callPartner, ds.camStream, {metadata: {type: 'camera'}});
                                    ds.connections[ds.callPartner].send({type: 'stream_notify'});
                                }
                                btn.classList.add('active');
                                
                                ds.camStream.getVideoTracks()[0].onended = () => {
                                    window.dcToggleCam();
                                };
                            } catch(e) {
                                console.error('❌ Camera error:', e);
                                if(e.name !== 'NotAllowedError') {
                                    alert('Could not access camera');
                                }
                            }
                        }
                    };

                    window.dcToggleScreen = async () => {
                        const btn = document.getElementById('btn-scr');
                        
                        if(ds.screenStream) {
                            ds.screenStream.getTracks().forEach(t => t.stop());
                            ds.screenStream = null;
                            if(ds.screenConn) {
                                ds.screenConn.close();
                                ds.screenConn = null;
                            }
                            document.getElementById('dc-vid-local').style.display = 'none';
                            btn.classList.remove('active');
                            
                            if(ds.callPartner && ds.connections[ds.callPartner]) {
                                ds.connections[ds.callPartner].send({type: 'stream_stop'});
                            }
                        } else {
                            try {
                                ds.screenStream = await navigator.mediaDevices.getDisplayMedia({video: true});
                                const vid = document.getElementById('dc-vid-local');
                                vid.style.display = 'block';
                                vid.srcObject = ds.screenStream;
                                
                                if(ds.callPartner) {
                                    ds.screenConn = ds.peer.call(ds.callPartner, ds.screenStream, {metadata: {type: 'screen'}});
                                    ds.connections[ds.callPartner].send({type: 'stream_notify'});
                                }
                                btn.classList.add('active');
                                
                                ds.screenStream.getVideoTracks()[0].onended = () => {
                                    window.dcToggleScreen();
                                };
                            } catch(e) {
                                console.error('❌ Screen share error:', e);
                            }
                        }
                    };
                    
                    window.dcWatchStream = () => {
                        document.getElementById('dc-watch-overlay').style.display = 'none';
                        const vid = document.getElementById('dc-vid-remote');
                        if(vid) {
                            vid.style.display = 'block';
                            vid.play().catch(e => console.log('Video play error:', e));
                        }
                    };

                    // --- FLAPPY BIRD GAME ---
                    
                    window.showFlappy = () => {
                        document.getElementById('flappy-overlay').style.display = 'flex';
                    };
                    
                    window.closeFlappy = () => {
                        document.getElementById('flappy-overlay').style.display = 'none';
                        ds.flappyRunning = false;
                    };
                    
                    window.startFlappy = () => {
                        const canvas = document.getElementById('flappy-canvas');
                        const ctx = canvas.getContext('2d');
                        
                        let bird = {x: 50, y: 150, velocity: 0, gravity: 0.5};
                        let pipes = [];
                        let score = 0;
                        let gameRunning = true;
                        ds.flappyRunning = true;
                        
                        function draw() {
                            if(!gameRunning || !ds.flappyRunning) return;
                            
                            ctx.fillStyle = '#4ec0ca';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            
                            ctx.fillStyle = '#f0db4f';
                            ctx.fillRect(bird.x, bird.y, 20, 20);
                            
                            bird.velocity += bird.gravity;
                            bird.y += bird.velocity;
                            
                            ctx.fillStyle = '#2ecc71';
                            pipes.forEach(pipe => {
                                ctx.fillRect(pipe.x, 0, 50, pipe.top);
                                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, 50, pipe.bottom);
                                
                                pipe.x -= 2;
                                
                                if(pipe.x + 50 < bird.x && !pipe.passed) {
                                    score++;
                                    pipe.passed = true;
                                }
                                
                                if(bird.x + 20 > pipe.x && bird.x < pipe.x + 50 &&
                                   (bird.y < pipe.top || bird.y + 20 > canvas.height - pipe.bottom)) {
                                    gameRunning = false;
                                }
                            });
                            
                            if(bird.y + 20 > canvas.height || bird.y < 0) {
                                gameRunning = false;
                            }
                            
                            pipes = pipes.filter(pipe => pipe.x > -50);
                            
                            if(Math.random() < 0.02) {
                                pipes.push({
                                    x: canvas.width,
                                    top: Math.random() * 200 + 50,
                                    bottom: Math.random() * 200 + 50,
                                    passed: false
                                });
                            }
                            
                            ctx.fillStyle = '#fff';
                            ctx.font = '24px Arial';
                            ctx.fillText('Score: ' + score, 10, 30);
                            
                            if(!gameRunning) {
                                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                                ctx.fillRect(0, 0, canvas.width, canvas.height);
                                ctx.fillStyle = '#fff';
                                ctx.font = '36px Arial';
                                ctx.fillText('Game Over!', 80, 200);
                                ctx.font = '24px Arial';
                                ctx.fillText('Final Score: ' + score, 90, 240);
                                ctx.fillText('Click to restart', 85, 280);
                                
                                canvas.onclick = function() {
                                    bird = {x: 50, y: 150, velocity: 0, gravity: 0.5};
                                    pipes = [];
                                    score = 0;
                                    gameRunning = true;
                                    canvas.onclick = flap;
                                };
                            }
                            
                            requestAnimationFrame(draw);
                        }
                        
                        function flap() {
                            if(gameRunning) {
                                bird.velocity = -8;
                            }
                        }
                        
                        canvas.onclick = flap;
                        document.onkeydown = function(e) {
                            if(e.code === 'Space' && gameRunning) {
                                bird.velocity = -8;
                            }
                        };
                        
                        draw();
                    };

                    // Initialize
                    setTimeout(() => {
                        renderChatList();
                        if(ds.me.name) {
                            document.getElementById('dc-set-name').value = ds.me.name;
                        }
                        setTimeout(() => {
                            if(ds.me.color) {
                                window.dcSetColor(ds.me.color);
                            }
                        }, 100);
                    }, 1000);
                }
            },

            // --- OLDER APPS (UNCHANGED) ---
            mines: {
                name: "Minesweeper", w: 290, h: 320,
                html: `<div style="padding:10px; background:#c0c0c0; text-align:center;"><button onclick="kernel.launch('mines')">🙂 Reset</button></div><div class="mine-grid" id="m-grid"></div>`,
                init: (p) => {
                    const grid = document.getElementById('m-grid');
                    let cells = [], gameOver = false;
                    const bombs = Array(100).fill(false);
                    for(let i=0; i<12; i++) bombs[Math.floor(Math.random()*100)] = true;
                    for(let i=0; i<100; i++) {
                        const div = document.createElement('div'); div.className = 'mine-cell';
                        div.onclick = () => {
                            if(gameOver || div.classList.contains('open')) return;
                            if(bombs[i]) { div.style.background='red'; div.innerHTML='💣'; alert('BOOM'); gameOver=true; }
                            else { 
                                let n = 0;
                                const x=i%10, y=Math.floor(i/10);
                                for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) {
                                    if(x+dx>=0 && x+dx<10 && y+dy>=0 && y+dy<10 && bombs[(y+dy)*10+(x+dx)]) n++;
                                }
                                div.className='mine-cell open'; if(n>0) { div.innerText=n; div.style.color=['','blue','green','red'][n]||'black'; }
                            }
                        };
                        grid.appendChild(div);
                    }
                }
            },
            pong: {
                name: "Pong", w: 420, h: 340,
                html: `<canvas id="pong-cvs" width="400" height="300"></canvas>`,
                init: (p) => {
                    const ctx = document.getElementById('pong-cvs').getContext('2d');
                    let ball = {x:200, y:150, vx:4, vy:4}, p2={y:110};
                    p.onTick = () => {
                        ball.x+=ball.vx; ball.y+=ball.vy;
                        if(ball.y<0||ball.y>300) ball.vy*=-1;
                        if(ball.x<0||ball.x>400) { ball.x=200; ball.vx*=-1; }
                        if(ball.y>p2.y+40) p2.y+=3; else p2.y-=3;
                        ctx.fillStyle='black'; ctx.fillRect(0,0,400,300);
                        ctx.fillStyle='white'; ctx.fillRect(380,p2.y,10,80); ctx.fillRect(ball.x,ball.y,10,10);
                    };
                }
            },
            breakout: {
                name: "Breakout", w: 320, h: 440,
                html: `<canvas id="brk-cvs" width="300" height="400"></canvas>`,
                init: (p) => {
                    const ctx = document.getElementById('brk-cvs').getContext('2d');
                    let b={x:150,y:300,vx:3,vy:-3}, pd={x:125};
                    let brks = Array(40).fill(1).map((_,i)=>({x:(i%8)*37+2, y:Math.floor(i/8)*20+30, s:1}));
                    document.onkeydown = (e) => { if(e.key=='ArrowLeft') pd.x-=20; if(e.key=='ArrowRight') pd.x+=20; };
                    p.onTick = () => {
                        b.x+=b.vx; b.y+=b.vy;
                        if(b.x<0||b.x>300) b.vx*=-1; if(b.y<0) b.vy*=-1;
                        if(b.y>380 && b.x>pd.x && b.x<pd.x+50) b.vy*=-1;
                        if(b.y>400) { b.x=150; b.y=300; b.vy=-3; }
                        ctx.fillStyle='#111'; ctx.fillRect(0,0,300,400);
                        ctx.fillStyle='cyan'; ctx.fillRect(pd.x,380,50,10);
                        ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.fill();
                        brks.forEach(k=>{ 
                            if(k.s){ 
                                ctx.fillStyle='orange'; ctx.fillRect(k.x,k.y,35,18); 
                                if(b.x>k.x && b.x<k.x+35 && b.y>k.y && b.y<k.y+18) { k.s=0; b.vy*=-1; }
                            } 
                        });
                    }
                }
            },
            camera: {
                name: "Camera", w: 500, h: 450,
                html: `<div class="cam-wrapper"><video id="cam-feed" autoplay></video><div class="cam-controls"><button onclick="window.startCam()">Power</button></div></div>`,
                init: (p) => {
                    window.startCam = async () => { 
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({video:true});
                            document.getElementById('cam-feed').srcObject = stream;
                        } catch(e) {
                            console.error('Camera error:', e);
                            alert('Could not access camera');
                        }
                    };
                }
            },
            notepad: {
                name: "Cheese Notepad", w: 400,
                html: `File: <input id="np-name" style="width:50%" value="note.txt"> <button onclick="window.saveFile()">Save</button><textarea id="np-box"></textarea>`,
                init: (p) => {
                    window.saveFile = () => { 
                        kernel.fs[document.getElementById('np-name').value] = document.getElementById('np-box').value; 
                        localStorage.setItem('cheese_v6_fs', JSON.stringify(kernel.fs)); 
                        alert('Saved.'); 
                    };
                }
            },
            explorer: {
                name: "File Explorer", w: 300, html: `<div id="explorer-list"></div>`,
                init: (p) => {
                    const l = document.getElementById('explorer-list');
                    p.onTick = () => {
                        l.innerHTML='';
                        Object.keys(kernel.fs).forEach(k=>{
                            const d=document.createElement('div'); 
                            d.innerText='📄 '+k; 
                            d.style.padding='5px'; 
                            d.style.borderBottom='1px solid #ccc';
                            d.onclick=()=>{ 
                                kernel.launch('notepad'); 
                                setTimeout(()=>{ 
                                    document.getElementById('np-name').value=k; 
                                    document.getElementById('np-box').value=kernel.fs[k];
                                },100); 
                            };
                            l.appendChild(d);
                        });
                    }
                }
            },
            terminal: {
                name: "Root Console", bodyCls: "term-box", w: 500,
                html: `CheeseOS v6.7 [root@cheese ~]# _`, init: (p) => {}
            }
        };
    </script>
</body>
</html>
