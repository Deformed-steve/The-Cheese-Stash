<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cheese OS v6.7 | The Social Update</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-teal: #008080;
            --win-gray: #c0c0c0;
            --win-blue: #000080;
            --win-blue-light: #1084d0;
            
            /* Discord / CheeseCord Palette */
            --dc-dark: #36393f;
            --dc-darker: #2f3136;
            --dc-darkest: #202225;
            --dc-light: #40444b;
            --dc-accent: #5865f2;
            --dc-green: #3ba55c;
            --dc-red: #ed4245;
            --dc-text: #dcddde;
            --dc-text-muted: #72767d;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Tahoma', sans-serif; }

        /* --- 3D INTERFACE --- */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; border: 1px solid rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
        #hud { position: absolute; bottom: 20px; left: 20px; color: #0f0; background: rgba(0,0,0,0.8); padding: 15px; border-left: 5px solid #0f0; font-family: monospace; z-index: 5; pointer-events: none; }

        /* --- MONITOR SYSTEM --- */
        #monitor-wrapper {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 1100px; height: 800px; background: var(--bg-teal); border: 18px solid #222;
            border-radius: 12px; box-shadow: 0 0 150px rgba(0,0,0,1); z-index: 100; overflow: hidden;
        }

        /* --- DESKTOP --- */
        #desktop { width: 100%; height: calc(100% - 40px); display: grid; grid-template-columns: repeat(auto-fill, 100px); grid-template-rows: repeat(auto-fill, 110px); grid-auto-flow: column; padding: 30px; gap: 15px; }
        .icon { width: 85px; height: 95px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-shadow: 2px 2px 3px #000; cursor: pointer; border: 1px solid transparent; }
        .icon:hover { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); }
        .icon span { font-size: 42px; filter: drop-shadow(2px 2px 2px #000); }
        .icon label { font-size: 11px; margin-top: 6px; font-weight: bold; text-align: center; }

        /* --- WINDOW MANAGER --- */
        .window { position: absolute; background: var(--win-gray); border: 2px outset #fff; box-shadow: 5px 5px 25px rgba(0,0,0,0.6); display: none; flex-direction: column; min-width: 250px; }
        .win-header { background: linear-gradient(90deg, var(--win-blue), var(--win-blue-light)); height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: white; font-weight: bold; font-size: 13px; cursor: move; }
        .win-body { flex: 1; padding: 0; overflow: hidden; background: #2f3136; color: #fff; position: relative; display: flex; flex-direction: column; }
        .win-controls { display: flex; gap: 4px; }
        .win-btn { width: 22px; height: 20px; background: var(--win-gray); border: 1px outset #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #000; font-size: 12px; font-weight: bold; }
        .win-btn:active { border-style: inset; padding: 1px 0 0 1px; }

        /* --- TASKBAR --- */
        #taskbar { position: absolute; bottom: 0; width: 100%; height: 40px; background: var(--win-gray); border-top: 2px solid #fff; display: flex; align-items: center; padding: 0 10px; z-index: 1001; }
        #start-btn { height: 30px; padding: 0 12px; background: var(--win-gray); border: 2px outset #fff; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        #clock { margin-left: auto; border: 2px inset #fff; padding: 0 15px; height: 30px; display: flex; align-items: center; font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; background: #bbb; color: #000; }

        /* --- APP STYLES --- */
        /* Common */
        canvas { display: block; background: #000; margin: 0 auto; image-rendering: pixelated; }
        textarea { width: 100%; height: 90%; border: 2px inset #fff; font-family: serif; resize: none; color: black; background: white; padding: 5px; }

        /* CheeseCord Specifics */
        .dc-app { display: flex; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; font-size: 14px; color: var(--dc-text); }
        .dc-sidebar-mini { width: 70px; background: var(--dc-darkest); display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 10px; }
        .dc-sidebar-main { width: 220px; background: var(--dc-darker); display: flex; flex-direction: column; }
        .dc-chat-area { flex: 1; background: var(--dc-dark); display: flex; flex-direction: column; position: relative; }
        
        .dc-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--dc-dark); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .dc-icon:hover { border-radius: 16px; background: var(--dc-accent); }
        .dc-icon img { width: 100%; height: 100%; object-fit: cover; }
        
        .dc-friend-item { padding: 10px; margin: 5px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .dc-friend-item:hover { background: var(--dc-light); }
        .dc-friend-item.active { background: rgba(88, 101, 242, 0.3); color: #fff; }
        .dc-friend-item.unread { background: rgba(88, 101, 242, 0.15); border-left: 3px solid var(--dc-accent); }
        .dc-friend-item.unread .unread-badge { display: block; }
        
        .unread-badge { display: none; position: absolute; right: 10px; background: var(--dc-accent); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        
        .dc-user-panel { height: 55px; background: #25272b; margin-top: auto; display: flex; align-items: center; padding: 0 10px; gap: 8px; }
        .dc-avatar-small { width: 32px; height: 32px; border-radius: 50%; position: relative; overflow: hidden; }
        .dc-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
        .dc-status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dc-green); position: absolute; bottom: -2px; right: -2px; border: 2px solid #25272b; }
        
        .dc-chat-msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .dc-msg { display: flex; gap: 15px; }
        .dc-msg-content h4 { margin: 0 0 5px 0; font-size: 15px; cursor: pointer; }
        .dc-msg-content h4:hover { text-decoration: underline; }
        .dc-msg-text { font-size: 14px; line-height: 1.4; color: #dcddde; }
        .dc-input-box { padding: 15px; }
        .dc-input { width: 100%; background: var(--dc-light); border: none; padding: 12px; border-radius: 8px; color: white; outline: none; }

        /* Chat Background */
        .dc-chat-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.1; pointer-events: none; z-index: 0; }
        .dc-chat-bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.4)); pointer-events: none; z-index: 1; }

        /* Call Overlay */
        .dc-call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10; display: none; flex-direction: column; }
        .dc-call-grid { flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
        .dc-call-user { width: 200px; height: 200px; background: var(--dc-darker); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 2px solid transparent; }
        .dc-call-user.speaking { border-color: var(--dc-green); }
        .dc-call-avatar { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); overflow: hidden; }
        .dc-call-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Stream Overlay on Avatar */
        .dc-stream-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); border-radius: 8px; display: none; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 5; }
        .dc-stream-overlay:hover { background: rgba(0,0,0,0.6); }
        .dc-video-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; border-radius: 8px; display: none; z-index: 2; }

        .dc-call-controls { height: 70px; background: #18191c; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .dc-ctrl-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: var(--dc-light); color: white; cursor: pointer; font-size: 20px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .dc-ctrl-btn:hover { background: #555; }
        .dc-ctrl-btn.active { background: white; color: black; }
        .dc-ctrl-btn.danger { background: var(--dc-red); }
        .dc-ctrl-btn.danger:hover { background: #c03537; }

        /* Incoming Call Popup */
        .dc-popup { position: absolute; top: 20px; right: 20px; width: 250px; background: var(--dc-darkest); padding: 15px; border-radius: 8px; border: 1px solid var(--dc-green); box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 100; display: none; }
        
        /* Settings Modal */
        .dc-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50; display: none; align-items: center; justify-content: center; }
        .dc-modal-box { width: 400px; background: var(--dc-dark); padding: 20px; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .dc-color-picker { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .dc-color-opt { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .dc-color-opt.selected { border-color: white; }
        
        /* Profile Picture Upload */
        .dc-avatar-upload { margin: 15px 0; }
        .dc-avatar-preview { width: 100px; height: 100px; border-radius: 50%; margin: 10px auto; overflow: hidden; border: 3px solid var(--dc-accent); }
        .dc-avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Background Settings */
        .dc-bg-options { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        .dc-bg-option { width: 80px; height: 60px; border-radius: 5px; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
        .dc-bg-option.selected { border-color: var(--dc-accent); }
        .dc-bg-option img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Group Management */
        .dc-group-modal { width: 500px; max-height: 80vh; overflow-y: auto; }
        .dc-group-member { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--dc-light); }
        .dc-group-member select { background: var(--dc-dark); color: white; border: 1px solid var(--dc-light); padding: 3px; }
        
        /* Flappy Bird Game Overlay */
        #flappy-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #flappy-overlay .close-btn { position: absolute; top: 20px; right: 20px; background: var(--dc-red); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #flappy-canvas { background: #4ec0ca; display: block; margin: 20px auto; border: 3px solid #333; }
        .flappy-controls { margin-top: 20px; color: white; text-align: center; }
        .flappy-controls button { background: var(--dc-accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 0 10px; }

        /* Notification Badge */
        .notification-badge { position: absolute; top: -5px; right: -5px; background: var(--dc-red); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Minesweeper & Others */
        .mine-grid { display: grid; grid-template-columns: repeat(10, 25px); gap: 1px; background: #888; border: 3px inset #fff; margin: 0 auto; width: fit-content; }
        .mine-cell { width: 25px; height: 25px; background: #c0c0c0; border: 2px outset #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-family: monospace; font-size: 16px; color: black; }
        .mine-cell.open { border: 1px solid #999; background: #ccc; }
        
        /* Camera App */
        .cam-wrapper { display: flex; flex-direction: column; height: 100%; background: #111; }
        video#cam-feed { width: 100%; flex: 1; background: #000; object-fit: cover; }
        .cam-controls { height: 50px; display: flex; justify-content: center; align-items: center; gap: 15px; background: #222; }
        .shutter-btn { width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 4px solid #888; cursor: pointer; }
        .shutter-btn:active { background: #ccc; }
        
        /* Group Call Styles */
        .dc-call-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100% - 70px);
        }
        
        .dc-call-user.speaking {
            animation: pulse-border 2s infinite;
        }
        
        @keyframes pulse-border {
            0% { border-color: transparent; }
            50% { border-color: var(--dc-green); }
            100% { border-color: transparent; }
        }
        
        .dc-group-call-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hud">
        [W,A,S,D] Move | [MOUSE] Look<br>
        [CLICK] Interaction / Power On PC<br>
        [ESC] Release Cursor / Exit OS
    </div>

    <div id="monitor-wrapper">
        <div id="desktop"></div>
        <div id="taskbar">
            <div id="start-btn" onclick="kernel.launch('terminal')"><b>🧀 Start</b></div>
            <div id="clock">19:30:00</div>
        </div>
    </div>

    <!-- Flappy Bird Overlay -->
    <div id="flappy-overlay">
        <button class="close-btn" onclick="window.closeFlappy()">✕</button>
        <h2 style="color: white; margin-bottom: 20px;">Flappy Cheese 🧀</h2>
        <canvas id="flappy-canvas" width="288" height="512"></canvas>
        <div class="flappy-controls">
            <p>Click or press SPACE to flap</p>
            <button onclick="window.startFlappy()">Start Game</button>
            <button onclick="window.closeFlappy()">Close Game</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as TWEEN from '@tweenjs/tween.js';

        // --- 1. 3D WORLD ENGINE ---
        let scene, camera, renderer, controls, clock = new THREE.Clock();
        let pScreen, isSitting = false;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.PointLight(0xffffff, 100, 100);
            light.position.set(0, 15, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // Desk & PC Setup
            const desk = new THREE.Mesh(new THREE.BoxGeometry(25, 1, 12), new THREE.MeshStandardMaterial({color: 0x3d2b1f}));
            desk.position.y = 5;
            scene.add(desk);

            const mon = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 1), new THREE.MeshStandardMaterial({color: 0x1a1a1a}));
            mon.position.set(0, 10, -2);
            scene.add(mon);

            pScreen = new THREE.Mesh(new THREE.PlaneGeometry(11.2, 7.2), new THREE.MeshBasicMaterial({color: 0x000000}));
            pScreen.position.set(0, 10, -1.48);
            scene.add(pScreen);

            const pwr = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({color: 0xff0000}));
            pwr.position.set(8, 6, 2);
            pwr.name = "POWER_BUTTON";
            scene.add(pwr);

            controls = new PointerLockControls(camera, document.body);
            document.addEventListener('mousedown', (e) => {
                if(!isSitting) {
                    const ray = new THREE.Raycaster();
                    ray.setFromCamera({x:0, y:0}, camera);
                    const hits = ray.intersectObjects(scene.children);
                    if(hits.length > 0 && hits[0].object.name === "POWER_BUTTON") {
                        bootSequence();
                    } else {
                        controls.lock();
                    }
                }
            });
            animate();
        }

        function bootSequence() {
            isSitting = true;
            controls.unlock();
            new TWEEN.Tween(camera.position).to({x:0, y:10, z:7}, 1500).easing(TWEEN.Easing.Quadratic.InOut)
                .onUpdate(() => camera.lookAt(0, 10, -2))
                .onComplete(() => {
                    document.getElementById('monitor-wrapper').style.display = 'block';
                    pScreen.material.color.setHex(0x008080);
                    kernel.init();
                }).start();
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            renderer.render(scene, camera);
            if(isSitting) kernel.tick(clock.getDelta());
        }

        init3D();

        // --- 2. KERNEL & APPS ---
        window.kernel = {
            running: false,
            procs: new Map(),
            zCounter: 1000,
            fs: JSON.parse(localStorage.getItem('cheese_v6_fs')) || { 'readme.txt': 'Welcome to Cheese OS v6.6\nDiscord Clone with Customization and Calls added!' },

            init: () => {
                if(kernel.running) return;
                kernel.running = true;
                const desktop = document.getElementById('desktop');
                const apps = [
                    {id: 'cheesecord', name: 'CheeseCord', icon: '💬'},
                    {id: 'mines', name: 'Minesweeper', icon: '💣'},
                    {id: 'pong', name: 'Pong', icon: '🏓'},
                    {id: 'breakout', name: 'Breakout', icon: '🧱'},
                    {id: 'camera', name: 'Camera', icon: '📷'},
                    {id: 'notepad', name: 'Notepad', icon: '📝'},
                    {id: 'explorer', name: 'Files', icon: '📁'},
                    {id: 'terminal', name: 'Terminal', icon: '📟'}
                ];
                apps.forEach(a => {
                    const d = document.createElement('div');
                    d.className = 'icon';
                    d.onclick = () => kernel.launch(a.id);
                    d.innerHTML = `<span>${a.icon}</span><label>${a.name}</label>`;
                    desktop.appendChild(d);
                });
            },

            tick: (dt) => {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
                kernel.procs.forEach(p => { if(p.onTick) p.onTick(dt); });
            },

            launch: (id) => {
                if(kernel.procs.has(id)) { kernel.focus(id); return; }
                const app = APP_DATA[id];
                const win = document.createElement('div');
                win.id = `win-${id}`;
                win.className = 'window';
                win.style.width = (app.w || 400) + 'px';
                win.style.height = (app.h || 'auto') + 'px';
                win.style.left = (50 + (kernel.procs.size * 30)) + 'px';
                win.style.top = (50 + (kernel.procs.size * 30)) + 'px';
                win.style.display = 'flex';
                win.style.zIndex = ++kernel.zCounter;

                win.innerHTML = `
                    <div class="win-header" id="head-${id}">
                        <span>${app.name}</span>
                        <div class="win-controls">
                            <div class="win-btn" onclick="kernel.kill('${id}')">X</div>
                        </div>
                    </div>
                    <div class="win-body ${app.bodyCls || ''}" id="body-${id}">${app.html}</div>
                `;
                document.getElementById('monitor-wrapper').appendChild(win);
                kernel.makeDraggable(win, id);
                const proc = { id, win, onTick: null };
                kernel.procs.set(id, proc);
                if(app.init) app.init(proc);
            },

            kill: (id) => {
                const el = document.getElementById(`win-${id}`);
                if(el) el.remove();
                if(id === 'cheesecord' && window.discordState) { 
                    if(window.discordState.localStream) {
                        window.discordState.localStream.getTracks().forEach(t=>t.stop());
                    }
                    if(window.discordState.groupCall) {
                        window.dcEndGroupCall();
                    }
                }
                kernel.procs.delete(id);
            },

            focus: (id) => { document.getElementById(`win-${id}`).style.zIndex = ++kernel.zCounter; },
            makeDraggable: (el, id) => {
                const head = document.getElementById(`head-${id}`);
                let x=0, y=0, x1=0, y1=0;
                head.onmousedown = (e) => {
                    x1 = e.clientX; y1 = e.clientY;
                    document.onmousemove = (ev) => {
                        x = x1 - ev.clientX; y = y1 - ev.clientY;
                        x1 = ev.clientX; y1 = ev.clientY;
                        el.style.top = (el.offsetTop - y) + "px";
                        el.style.left = (el.offsetLeft - x) + "px";
                    };
                    document.onmouseup = () => document.onmousemove = null;
                };
                el.onmousedown = () => kernel.focus(id);
            }
        };

        // --- 3. APP REGISTRY ---
        const APP_DATA = {

            // --- CHEESECORD V4.0 (WITH GROUP CALLING) ---
            cheesecord: {
                name: "CheeseCord", w: 900, h: 600,
                html: `
                    <div id="dc-popup" class="dc-popup">
                        <div style="font-weight:bold; margin-bottom:10px;">📞 Incoming Call</div>
                        <div id="dc-popup-name">Unknown</div>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <button class="dc-btn" style="background:var(--dc-green); color:white; border:none; padding:5px; flex:1" onclick="window.dcAnswer()">Answer</button>
                            <button class="dc-btn" style="background:var(--dc-red); color:white; border:none; padding:5px; flex:1" onclick="window.dcReject()">Decline</button>
                        </div>
                    </div>

                    <div id="dc-settings" class="dc-modal">
                        <div class="dc-modal-box">
                            <h2>User Settings</h2>
                            <div class="dc-avatar-upload">

                    <div class="dc-app">

                                        <div id="dc-watch-overlay" class="dc-stream-overlay" onclick="window.dcWatchStream()">

                                    <button class="dc-ctrl-btn" onclick="window.dcToggleDeafen()" id="btn-deaf">🎧</button>
                                    <button class="dc-ctrl-btn" onclick="window.dcToggleCam()" id="btn-cam">📷</button>
                                    <button class="dc-ctrl-btn" onclick="window.dcToggleScreen()" id="btn-scr">🖥️</button>
                                    <button class="dc-ctrl-btn danger" onclick="window.dcHangup()" id="btn-hangup">📞</button>
                                </div>
                            </div>

                            <div style="height:50px; border-bottom:1px solid #26272d; display:flex; align-items:center; padding:0 20px; justify-content:space-between; position:relative; z-index:3;">
                                <div style="font-weight:bold; display:flex; align-items:center; gap:10px;">
                                    <span id="dc-header-icon" style="font-size:20px; color:#8e9297;">@</span>
                                    <span id="dc-header-name">Select a Chat</span>
                                    <span id="dc-header-type" style="font-size:12px; color:#72767d; margin-left:5px;"></span>
                                </div>
                                <div id="dc-header-icons" style="display:none; gap:15px; color:#b9bbbe; position:relative; z-index:3;">
                                    <span style="cursor:pointer;" title="Start Voice Call" onclick="window.dcStartCall()">📞</span>
                                    <span style="cursor:pointer;" title="Start Group Call" onclick="window.showGroupCallModal()" id="btn-group-call">👥</span>
                                    <span style="cursor:pointer;" title="Change Background" onclick="window.dcOpenBgSettings()" id="btn-bg">🎨</span>
                                </div>
                            </div>

                            <div id="dc-msg-feed" class="dc-chat-msgs"></div>
                            
                            <div class="dc-input-box" style="position:relative; z-index:3;">

                            </div>
                        </div>
                    </div>
                `,
                init: (p) => {
                    // --- SETUP STATE ---
                    let userSettings = JSON.parse(localStorage.getItem('cheese_dc_user')) || { 
                        name: 'User_' + Math.floor(Math.random()*999), 
                        color: '#5865f2',
                        avatar: ''
                    };

                    if(!window.discordState) {
                        window.discordState = {
                            peer: null,
                            me: userSettings,
                            chats: {},
                            connections: {},
                            activeChat: null,
                            callState: 'idle',
                            callPartner: null,
                            groupCall: null,
                            pendingGroupCall: null,
                            localStream: null,
                            remoteStream: null,
                            mediaConn: null,
                            screenConn: null,
                            camConn: null,
                            screenStream: null,
                            camStream: null,
                            notificationCount: 0,
                            flappyRunning: false,
                            groupCallUIUpdate: null
                        };

                        const ds = window.discordState;

                        // Initialize Peer
                        setTimeout(() => {
                            ds.peer = new Peer();
                            
                            ds.peer.on('open', (id) => {
                                console.log('✅ Peer ID:', id);
                                document.getElementById('dc-my-id').innerText = id;
                                document.getElementById('dc-my-name').innerText = ds.me.name;
                                
                                // Load avatar
                                if(ds.me.avatar) {
                                    document.getElementById('dc-my-avatar-img').src = ds.me.avatar;
                                    document.getElementById('dc-avatar-img').src = ds.me.avatar;
                                    document.getElementById('dc-call-av-me').innerHTML = `<img src="${ds.me.avatar}">`;
                                } else {
                                    document.getElementById('dc-my-avatar').style.background = ds.me.color;
                                    document.getElementById('dc-call-av-me').style.background = ds.me.color;
                                }
                                
                                // Request notification permission
                                if ("Notification" in window && Notification.permission === "default") {
                                    Notification.requestPermission();
                                }
                            });

                            ds.peer.on('connection', (conn) => { 
                                console.log('🔗 New connection from:', conn.peer);
                                handleDataConn(conn); 
                            });

                            ds.peer.on('call', (call) => {
                                console.log('📞 Incoming call from:', call.peer, 'type:', call.metadata?.type);
                                
                                const metadata = call.metadata || {};
                                
                                if(metadata.type === 'screen') {
                                    // Screen share
                                    call.answer();
                                    call.on('stream', (stream) => {
                                        console.log('🖥️ Received screen stream');
                                        const vid = document.getElementById('dc-vid-remote');
                                        if(vid) {
                                            vid.srcObject = stream;
                                            document.getElementById('dc-watch-overlay').style.display = 'flex';
                                        }
                                    });
                                } else if(metadata.type === 'camera') {
                                    // Camera
                                    call.answer();
                                    call.on('stream', (stream) => {
                                        console.log('📷 Received camera stream');
                                        const vid = document.getElementById('dc-vid-remote');
                                        if(vid) {
                                            vid.srcObject = stream;
                                            document.getElementById('dc-watch-overlay').style.display = 'flex';
                                        }
                                    });
                                } else {
                                    // Audio call
                                    if(ds.localStream) {
                                        call.answer(ds.localStream);
                                    } else {
                                        navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
                                            ds.localStream = stream;
                                            call.answer(stream);
                                        });
                                    }
                                    call.on('stream', (stream) => {
                                        console.log('🔊 Received audio stream');
                                        const audio = new Audio();
                                        audio.srcObject = stream;
                                        audio.autoplay = true;
                                        ds.remoteStream = stream;
                                    });
                                    ds.mediaConn = call;
                                    ds.callPartner = call.peer;
                                    
                                    // Show call notification
                                    const chat = Object.values(ds.chats).find(c => 
                                        c.type === 'dm' && c.members.includes(call.peer)
                                    );
                                    if(chat) {
                                        showNotification(`${chat.name} is calling...`, '📞 Incoming Call');
                                    }
                                }
                            });
                            
                            ds.peer.on('error', (err) => {
                                console.error('❌ PeerJS error:', err);
                            });
                        }, 500);
                    }

                    const ds = window.discordState;

                    // Helper Functions
                    function showNotification(title, body) {
                        ds.notificationCount++;
                        updateNotificationBadge();
                        
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/5968/5968756.png' });
                        }
                        
                        const badge = document.getElementById('dc-notification-badge');
                        badge.style.display = 'flex';
                        badge.textContent = ds.notificationCount;
                        
                        flashTaskbar();
                    }
                    
                    function flashTaskbar() {
                        const originalTitle = document.title;
                        let flashCount = 0;
                        const flashInterval = setInterval(() => {
                            document.title = document.title === originalTitle ? '📨 New Message!' : originalTitle;
                            flashCount++;
                            if(flashCount >= 6) {
                                clearInterval(flashInterval);
                                document.title = originalTitle;
                            }
                        }, 500);
                    }
                    
                    function updateNotificationBadge() {
                        const badge = document.getElementById('dc-notification-badge');
                        const totalUnread = Object.values(ds.chats).reduce((sum, chat) => sum + chat.unread, 0);
                        ds.notificationCount = totalUnread;
                        
                        if(totalUnread > 0) {
                            badge.style.display = 'flex';
                            badge.textContent = totalUnread > 9 ? '9+' : totalUnread;
                        } else {
                            badge.style.display = 'none';
                        }
                    }
                    
                    function markChatAsRead(chatId) {
                        if(ds.chats[chatId]) {
                            ds.chats[chatId].unread = 0;
                            updateNotificationBadge();
                            renderChatList();
                        }
                    }

                    function handleDataConn(conn) {
                        const peerId = conn.peer;
                        ds.connections[peerId] = conn;

                        conn.on('open', () => {
                            console.log('✅ Connection opened with:', peerId);
                            conn.send({ 
                                type: 'handshake', 
                                name: ds.me.name, 
                                color: ds.me.color,
                                avatar: ds.me.avatar,
                                peerId: ds.peer.id
                            });
                        });

                        conn.on('data', (data) => {
                            console.log('📨 Data from', peerId, ':', data.type);
                            
                            switch(data.type) {
                                case 'handshake':
                                    const dmId = `dm_${peerId}`;
                                    if(!ds.chats[dmId]) {
                                        ds.chats[dmId] = {
                                            type: 'dm',
                                            id: dmId,
                                            name: data.name,
                                            avatar: data.avatar,
                                            color: data.color,
                                            members: [ds.peer.id, peerId],
                                            msgs: [],
                                            unread: 0,
                                            background: ''
                                        };
                                        renderChatList();
                                    }
                                    break;
                                    
                                case 'msg':
                                    const chat = Object.values(ds.chats).find(c => 
                                        c.members.includes(peerId) && c.type === 'dm'
                                    );
                                    if(chat) {
                                        chat.msgs.push({ 
                                            sender: peerId, 
                                            name: chat.name, 
                                            avatar: chat.avatar, 
                                            text: data.text, 
                                            time: new Date().toLocaleTimeString() 
                                        });
                                        
                                        if(ds.activeChat !== chat.id) {
                                            chat.unread++;
                                            showNotification(`${chat.name}`, data.text);
                                        }
                                        
                                        if(ds.activeChat === chat.id) {
                                            renderChat();
                                        }
                                        renderChatList();
                                        updateNotificationBadge();
                                    }
                                    break;
                                    
                                case 'group_create':
                                    ds.chats[data.groupId] = {
                                        type: 'group',
                                        id: data.groupId,
                                        name: data.groupName,
                                        avatar: '👥',
                                        color: '#7289da',
                                        members: data.members,
                                        owner: data.owner,
                                        admins: data.admins || [],
                                        msgs: [],
                                        unread: 0,
                                        background: ''
                                    };
                                    renderChatList();
                                    showNotification(`Added to group: ${data.groupName}`, `You were added to a group by ${data.ownerName}`);
                                    break;
                                    
                                case 'group_msg':
                                    const group = ds.chats[data.groupId];
                                    if(group) {
                                        group.msgs.push({
                                            sender: peerId,
                                            name: data.senderName,
                                            avatar: data.senderAvatar,
                                            text: data.text,
                                            time: new Date().toLocaleTimeString()
                                        });
                                        
                                        if(ds.activeChat !== group.id) {
                                            group.unread++;
                                            showNotification(`${data.senderName} in ${group.name}`, data.text);
                                        }
                                        
                                        if(ds.activeChat === group.id) {
                                            renderChat();
                                        }
                                        renderChatList();
                                        updateNotificationBadge();
                                    }
                                    break;
                                    
                                case 'background_change':
                                    const targetChat = ds.chats[data.chatId];
                                    if(targetChat) {
                                        targetChat.background = data.background;
                                        if(ds.activeChat === data.chatId) {
                                            updateChatBackground();
                                        }
                                    }
                                    break;
                                    
                                case 'call_request':
                                    if(ds.callState !== 'idle') {
                                        conn.send({type: 'call_busy'});
                                    } else {
                                        const dmChat = Object.values(ds.chats).find(c => 
                                            c.members.includes(peerId) && c.type === 'dm'
                                        );
                                        if(dmChat) {
                                            document.getElementById('dc-popup').style.display = 'block';
                                            document.getElementById('dc-popup-name').innerText = dmChat.name;
                                            ds.callPartner = peerId;
                                        }
                                    }
                                    break;
                                    
                                case 'call_accept':
                                    startMediaCall(peerId);
                                    break;
                                    
                                case 'call_reject':
                                    alert("Call was declined");
                                    break;
                                    
                                case 'hangup':
                                    resetCallUI();
                                    break;
                                    
                                case 'stream_notify':
                                    document.getElementById('dc-watch-overlay').style.display = 'flex';
                                    break;
                                    
                                case 'stream_stop':
                                    document.getElementById('dc-watch-overlay').style.display = 'none';
                                    const vid = document.getElementById('dc-vid-remote');
                                    if(vid) vid.style.display = 'none';
                                    break;
                                    
                                // --- GROUP CALL MESSAGES ---
                                case 'group_call_invite':
                                    if(ds.callState !== 'idle' || ds.groupCall) {
                                        conn.send({type: 'group_call_busy'});
                                        break;
                                    }
                                    
                                    const groupChat = ds.chats[data.groupId];
                                    if(groupChat) {
                                        ds.pendingGroupCall = {
                                            callId: data.callId,
                                            groupId: data.groupId,
                                            groupName: data.groupName,
                                            callerName: data.callerName,
                                            participants: data.participants,
                                            fromPeer: conn.peer
                                        };
                                        
                                        let popup = document.getElementById('dc-group-call-popup');
                                        if(!popup) {
                                            popup = document.createElement('div');
                                            popup.id = 'dc-group-call-popup';
                                            popup.className = 'dc-popup';
                                            popup.style.width = '300px';
                                            popup.innerHTML = `
                                                <div style="font-weight:bold; margin-bottom:10px; display:flex; align-items:center; gap:5px;">
                                                    <span>👥 Group Call Invite</span>
                                                </div>
                                                <div style="margin-bottom:5px;"><b>${data.callerName}</b> is calling in <b>${data.groupName}</b></div>
                                                <div style="font-size:12px; color:#b9bbbe; margin-bottom:10px;">
                                                    ${data.participants.length} participants
                                                </div>
                                                <div style="display:flex; gap:10px;">
                                                    <button class="dc-btn" style="background:var(--dc-green); color:white; border:none; padding:8px; flex:1; cursor:pointer;" onclick="window.dcAcceptGroupCall()">Join</button>
                                                    <button class="dc-btn" style="background:var(--dc-red); color:white; border:none; padding:8px; flex:1; cursor:pointer;" onclick="window.dcRejectGroupCall()">Decline</button>
                                                </div>
                                            `;
                                            document.getElementById('body-cheesecord').appendChild(popup);
                                        }
                                        popup.style.display = 'block';
                                    }
                                    break;
                                    
                                case 'group_call_accept':
                                    if(ds.groupCall && ds.groupCall.id === data.callId) {
                                        ds.groupCall.participants.push(conn.peer);
                                        
                                        if(ds.localStream) {
                                            const call = ds.peer.call(conn.peer, ds.localStream);
                                            ds.groupCall.connections[conn.peer] = call;
                                            
                                            call.on('stream', (stream) => {
                                                ds.groupCall.streams[conn.peer] = stream;
                                                updateGroupCallUI();
                                            });
                                        }
                                        
                                        updateGroupCallUI();
                                        
                                        Object.keys(ds.groupCall.connections).forEach(peerId => {
                                            if(peerId !== conn.peer && ds.connections[peerId]) {
                                                ds.connections[peerId].send({
                                                    type: 'group_call_participant_joined',
                                                    callId: ds.groupCall.id,
                                                    participantId: conn.peer,
                                                    participantName: data.participantName
                                                });
                                            }
                                        });
                                    }
                                    break;
                                    
                                case 'group_call_participant_joined':
                                    if(ds.groupCall && ds.groupCall.id === data.callId && !ds.groupCall.participants.includes(data.participantId)) {
                                        ds.groupCall.participants.push(data.participantId);
                                        updateGroupCallUI();
                                    }
                                    break;
                                    
                                case 'group_call_hangup':
                                    if(ds.groupCall && ds.groupCall.id === data.callId) {
                                        const index = ds.groupCall.participants.indexOf(conn.peer);
                                        if(index > -1) {
                                            ds.groupCall.participants.splice(index, 1);
                                            if(ds.groupCall.connections[conn.peer]) {
                                                ds.groupCall.connections[conn.peer].close();
                                                delete ds.groupCall.connections[conn.peer];
                                            }
                                            if(ds.groupCall.streams[conn.peer]) {
                                                delete ds.groupCall.streams[conn.peer];
                                            }
                                            updateGroupCallUI();
                                        }
                                        
                                        if(ds.groupCall.participants.length === 1 && ds.groupCall.participants[0] === ds.peer.id) {
                                            window.dcEndGroupCall();
                                        }
                                    }
                                    break;
                                    
                                case 'group_call_busy':
                                    alert('Group call is busy or participant unavailable');
                                    break;
                            }
                        });
                        
                        conn.on('close', () => {
                            console.log('🔌 Connection closed with:', peerId);
                            delete ds.connections[peerId];
                        });
                    }

                    // UI Functions
                    function renderChatList() {
                        const list = document.getElementById('dc-chat-list');
                        list.innerHTML = '';
                        
                        const sortedChats = Object.values(ds.chats).sort((a, b) => {
                            if(a.type === 'group' && b.type !== 'group') return -1;
                            if(a.type !== 'group' && b.type === 'group') return 1;
                            return a.name.localeCompare(b.name);
                        });
                        
                        sortedChats.forEach(chat => {
                            const el = document.createElement('div');
                            el.className = `dc-friend-item ${ds.activeChat===chat.id ? 'active' : ''} ${chat.unread > 0 ? 'unread' : ''}`;
                            
                            const avatarContent = chat.avatar && !chat.avatar.includes('👥') ? 
                                `<img src="${chat.avatar}" style="width:100%; height:100%; object-fit:cover;">` :
                                `<div style="width:100%; height:100%; background:${chat.color}; display:flex; align-items:center; justify-content:center; font-size:${chat.type === 'group' ? '20px' : '16px'};">${chat.avatar || ''}</div>`;
                            
                            el.innerHTML = `
                                <div class="dc-avatar-small" style="width:40px; height:40px;">
                                    ${avatarContent}
                                </div>
                                <div style="flex:1; overflow:hidden;">
                                    <div style="font-weight:bold; font-size:13px;">${chat.name}</div>
                                    <div style="font-size:11px; color:#72767d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                                        ${chat.type === 'group' ? '👥 Group' : '💬 DM'}
                                    </div>
                                </div>
                                ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
                            `;
                            
                            el.onclick = () => {
                                ds.activeChat = chat.id;
                                markChatAsRead(chat.id);
                                renderChat();
                                renderChatList();
                                
                                document.getElementById('dc-header-name').innerText = chat.name;
                                document.getElementById('dc-header-type').innerText = chat.type === 'group' ? 'Group' : 'Direct Message';
                                document.getElementById('dc-header-icon').innerText = chat.type === 'group' ? '👥' : '@';
                                document.getElementById('dc-header-icons').style.display = 'flex';
                                
                                const bgBtn = document.getElementById('btn-bg');
                                const groupCallBtn = document.getElementById('btn-group-call');
                                
                                if(chat.type === 'group') {
                                    groupCallBtn.style.display = 'inline-block';
                                    if(chat.owner === ds.peer.id || chat.admins.includes(ds.peer.id)) {
                                        bgBtn.style.display = 'inline-block';
                                    } else {
                                        bgBtn.style.display = 'none';
                                    }
                                } else if(chat.type === 'dm') {
                                    groupCallBtn.style.display = 'none';
                                    bgBtn.style.display = 'inline-block';
                                } else {
                                    groupCallBtn.style.display = 'none';
                                    bgBtn.style.display = 'none';
                                }
                                
                                updateChatBackground();
                            };
                            
                            list.appendChild(el);
                        });
                    }

                    function renderChat() {
                        const feed = document.getElementById('dc-msg-feed');
                        feed.innerHTML = '';
                        
                        const chat = ds.chats[ds.activeChat];
                        if(!chat) return;
                        
                        chat.msgs.forEach(msg => {
                            const d = document.createElement('div');
                            d.className = 'dc-msg';
                            
                            const avatarContent = msg.avatar ? 
                                `<img src="${msg.avatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` :
                                `<div style="width:100%; height:100%; background:${chat.color}; border-radius:50%;"></div>`;
                            
                            d.innerHTML = `
                                <div class="dc-avatar-small" style="width:40px; height:40px;">
                                    ${avatarContent}
                                </div>
                                <div class="dc-msg-content">
                                    <h4>${msg.name} <span style="font-size:11px; color:#72767d; font-weight:normal;">${msg.time}</span></h4>
                                    <div class="dc-msg-text">${msg.text}</div>
                                </div>
                            `;
                            feed.appendChild(d);
                        });
                        
                        feed.scrollTop = feed.scrollHeight;
                    }

                    function updateChatBackground() {
                        const chat = ds.chats[ds.activeChat];
                        if(!chat) return;
                        
                        const bgImg = document.getElementById('dc-chat-bg-img');
                        if(chat.background && chat.background !== 'none') {
                            if(chat.background.startsWith('http') || chat.background.startsWith('data:')) {
                                bgImg.src = chat.background;
                                bgImg.style.display = 'block';
                            } else {
                                const bgUrls = {
                                    'space': 'https://images.unsplash.com/photo-1446776653964-20c1d3a81b06?w=1920&q=80',
                                    'forest': 'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1920&q=80',
                                    'beach': 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80',
                                    'city': 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1920&q=80'
                                };
                                bgImg.src = bgUrls[chat.background] || '';
                                bgImg.style.display = bgUrls[chat.background] ? 'block' : 'none';
                            }
                        } else {
                            bgImg.style.display = 'none';
                        }
                    }

                    // --- UI ACTIONS ---

                    window.dcAddFriend = () => {
                        const id = document.getElementById('dc-add-code').value.trim();
                        if(id && id !== ds.peer?.id && ds.peer) {
                            console.log('👥 Adding friend:', id);
                            const conn = ds.peer.connect(id);
                            handleDataConn(conn);
                            document.getElementById('dc-add-code').value = '';
                        } else {
                            alert('Please enter a valid friend ID');
                        }
                    };

                    window.dcSend = () => {
                        const text = document.getElementById('dc-msg-input').value;
                        if(!text || !ds.activeChat) return;
                        
                        const chat = ds.chats[ds.activeChat];
                        if(!chat) return;
                        
                        chat.msgs.push({
                            sender: ds.peer.id,
                            name: ds.me.name,
                            avatar: ds.me.avatar,
                            text: text,
                            time: new Date().toLocaleTimeString()
                        });
                        
                        renderChat();
                        document.getElementById('dc-msg-input').value = '';
                        
                        if(chat.type === 'dm') {
                            const otherMember = chat.members.find(m => m !== ds.peer.id);
                            if(otherMember && ds.connections[otherMember]) {
                                ds.connections[otherMember].send({
                                    type: 'msg',
                                    text: text
                                });
                            }
                        } else if(chat.type === 'group') {
                            chat.members.forEach(memberId => {
                                if(memberId !== ds.peer.id && ds.connections[memberId]) {
                                    ds.connections[memberId].send({
                                        type: 'group_msg',
                                        groupId: chat.id,
                                        senderName: ds.me.name,
                                        senderAvatar: ds.me.avatar,
                                        text: text
                                    });
                                }
                            });
                        }
                    };

                    // --- SETTINGS ---
                    
                    const avatarInput = document.getElementById('dc-avatar-input');
                    if(avatarInput) {
                        avatarInput.onchange = function(e) {
                            const file = e.target.files[0];
                            if(file) {
                                const reader = new FileReader();
                                reader.onload = function(event) {
                                    ds.me.avatar = event.target.result;
                                    document.getElementById('dc-avatar-img').src = event.target.result;
                                    document.getElementById('dc-my-avatar-img').src = event.target.result;
                                    document.getElementById('dc-call-av-me').innerHTML = `<img src="${event.target.result}">`;
                                    
                                    Object.values(ds.connections).forEach(conn => {
                                        if(conn.open) {
                                            conn.send({
                                                type: 'handshake',
                                                name: ds.me.name,
                                                color: ds.me.color,
                                                avatar: ds.me.avatar,
                                                peerId: ds.peer.id
                                            });
                                        }
                                    });
                                };
                                reader.readAsDataURL(file);
                            }
                        };
                    }

                    window.dcSetColor = (c) => {
                        document.querySelectorAll('.dc-color-opt').forEach(opt => {
                            opt.classList.remove('selected');
                            if(opt.style.background === c) {
                                opt.classList.add('selected');
                            }
                        });
                        ds.tempColor = c;
                    };

                    window.dcSaveSettings = () => {
                        const newName = document.getElementById('dc-set-name').value;
                        if(newName) ds.me.name = newName;
                        if(ds.tempColor) ds.me.color = ds.tempColor;
                        
                        localStorage.setItem('cheese_dc_user', JSON.stringify(ds.me));
                        
                        document.getElementById('dc-my-name').innerText = ds.me.name;
                        if(!ds.me.avatar) {
                            document.getElementById('dc-my-avatar').style.background = ds.me.color;
                            document.getElementById('dc-call-av-me').style.background = ds.me.color;
                        }
                        
                        document.getElementById('dc-settings').style.display = 'none';
                        
                        Object.values(ds.connections).forEach(conn => {
                            if(conn.open) {
                                conn.send({
                                    type: 'handshake',
                                    name: ds.me.name,
                                    color: ds.me.color,
                                    avatar: ds.me.avatar,
                                    peerId: ds.peer.id
                                });
                            }
                        });
                    };

                    // --- GROUP MANAGEMENT ---
                    
                    window.showGroupModal = () => {
                        const modal = document.getElementById('dc-group-modal');
                        const membersList = document.getElementById('dc-group-members-list');
                        membersList.innerHTML = '';
                        
                        const dmFriends = Object.values(ds.chats).filter(c => c.type === 'dm');
                        
                        if(dmFriends.length === 0) {
                            membersList.innerHTML = '<div style="color:#72767d; text-align:center; padding:20px;">No friends to add to group</div>';
                        } else {
                            dmFriends.forEach(chat => {
                                const otherMember = chat.members.find(m => m !== ds.peer.id);
                                const memberDiv = document.createElement('div');
                                memberDiv.className = 'dc-group-member';
                                memberDiv.innerHTML = `
                                    <div style="display:flex; align-items:center; gap:10px;">
                                        <div class="dc-avatar-small" style="width:24px; height:24px; background:${chat.color};"></div>
                                        <span>${chat.name}</span>
                                    </div>
                                    <input type="checkbox" class="group-member-checkbox" data-peerid="${otherMember}" data-chatid="${chat.id}">
                                `;
                                membersList.appendChild(memberDiv);
                            });
                        }
                        
                        modal.style.display = 'flex';
                    };

                    window.dcCreateGroup = () => {
                        const groupName = document.getElementById('dc-group-name').value;
                        if(!groupName) {
                            alert('Please enter a group name');
                            return;
                        }
                        
                        const checkboxes = document.querySelectorAll('.group-member-checkbox:checked');
                        const selectedMembers = Array.from(checkboxes).map(cb => ({
                            peerId: cb.dataset.peerid,
                            chatId: cb.dataset.chatid
                        }));
                        
                        if(selectedMembers.length === 0) {
                            alert('Please select at least one member');
                            return;
                        }
                        
                        const groupId = 'group_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        
                        const allMembers = [ds.peer.id, ...selectedMembers.map(m => m.peerId)];
                        
                        ds.chats[groupId] = {
                            type: 'group',
                            id: groupId,
                            name: groupName,
                            avatar: '👥',
                            color: '#7289da',
                            members: allMembers,
                            owner: ds.peer.id,
                            admins: [ds.peer.id],
                            msgs: [],
                            unread: 0,
                            background: ''
                        };
                        
                        selectedMembers.forEach(member => {
                            const conn = ds.connections[member.peerId];
                            if(conn && conn.open) {
                                conn.send({
                                    type: 'group_create',
                                    groupId: groupId,
                                    groupName: groupName,
                                    members: allMembers,
                                    owner: ds.peer.id,
                                    ownerName: ds.me.name,
                                    admins: [ds.peer.id]
                                });
                            }
                        });
                        
                        document.getElementById('dc-group-modal').style.display = 'none';
                        renderChatList();
                        showNotification(`Group Created`, `You created "${groupName}"`);
                    };

                    // --- BACKGROUND SETTINGS ---
                    
                    window.dcOpenBgSettings = () => {
                        if(!ds.activeChat) return;
                        document.getElementById('dc-bg-modal').style.display = 'flex';
                    };

                    window.dcSetBackground = (bg) => {
                        const chat = ds.chats[ds.activeChat];
                        if(!chat) return;
                        
                        chat.background = bg;
                        updateChatBackground();
                        
                        if(chat.type === 'dm') {
                            const otherMember = chat.members.find(m => m !== ds.peer.id);
                            if(otherMember && ds.connections[otherMember]) {
                                ds.connections[otherMember].send({
                                    type: 'background_change',
                                    chatId: chat.id,
                                    background: bg
                                });
                            }
                        } else if(chat.type === 'group' && (chat.owner === ds.peer.id || chat.admins.includes(ds.peer.id))) {
                            chat.members.forEach(memberId => {
                                if(memberId !== ds.peer.id && ds.connections[memberId]) {
                                    ds.connections[memberId].send({
                                        type: 'background_change',
                                        chatId: chat.id,
                                        background: bg
                                    });
                                }
                            });
                        }
                        
                        document.getElementById('dc-bg-modal').style.display = 'none';
                    };

                    window.dcUploadBackground = () => {
                        const fileInput = document.getElementById('dc-bg-upload');
                        const file = fileInput.files[0];
                        if(file) {
                            const reader = new FileReader();
                            reader.onload = function(event) {
                                window.dcSetBackground(event.target.result);
                            };
                            reader.readAsDataURL(file);
                        }
                    };

                    // --- REGULAR CALLING LOGIC ---

                    window.dcStartCall = async () => {
                        const chat = ds.chats[ds.activeChat];
                        if(!chat || chat.type !== 'dm') {
                            alert('Can only call individual friends');
                            return;
                        }
                        
                        const otherMember = chat.members.find(m => m !== ds.peer.id);
                        if(!otherMember || !ds.connections[otherMember]) {
                            alert('Friend is not connected');
                            return;
                        }
                        
                        ds.callPartner = otherMember;
                        ds.connections[otherMember].send({type: 'call_request'});
                        
                        try {
                            ds.localStream = await navigator.mediaDevices.getUserMedia({audio: true});
                            enterCallUI();
                        } catch(e) {
                            console.error('❌ Error getting microphone:', e);
                            alert('Could not access microphone');
                        }
                    };

                    window.dcAnswer = async () => {
                        document.getElementById('dc-popup').style.display = 'none';
                        
                        if(!ds.callPartner || !ds.connections[ds.callPartner]) return;
                        
                        ds.connections[ds.callPartner].send({type: 'call_accept'});
                        
                        try {
                            ds.localStream = await navigator.mediaDevices.getUserMedia({audio: true});
                            enterCallUI();
                        } catch(e) {
                            console.error('❌ Error getting microphone:', e);
                            alert('Could not access microphone');
                        }
                    };

                    window.dcReject = () => {
                        document.getElementById('dc-popup').style.display = 'none';
                        if(ds.callPartner && ds.connections[ds.callPartner]) {
                            ds.connections[ds.callPartner].send({type: 'call_reject'});
                        }
                        ds.callPartner = null;
                    };

                    async function startMediaCall(peerId) {
                        if(!ds.localStream) {
                            ds.localStream = await navigator.mediaDevices.getUserMedia({audio: true});
                        }
                        
                        const call = ds.peer.call(peerId, ds.localStream);
                        ds.mediaConn = call;
                        
                        call.on('stream', (stream) => {
                            const audio = new Audio();
                            audio.srcObject = stream;
                            audio.autoplay = true;
                            ds.remoteStream = stream;
                        });
                        
                        enterCallUI();
                    }

                    function enterCallUI() {
                        ds.callState = 'connected';
                        document.getElementById('dc-call-ui').style.display = 'flex';
                        
                        if(ds.callPartner) {
                            const chat = Object.values(ds.chats).find(c => 
                                c.members.includes(ds.callPartner) && c.type === 'dm'
                            );
                            if(chat) {
                                document.getElementById('dc-call-name-them').innerText = chat.name;
                                if(chat.avatar) {
                                    document.getElementById('dc-call-av-them').innerHTML = `<img src="${chat.avatar}">`;
                                } else {
                                    document.getElementById('dc-call-av-them').style.background = chat.color;
                                }
                            }
                        }
                    }

                    // --- GROUP CALLING LOGIC ---

                    window.showGroupCallModal = () => {
                        const modal = document.getElementById('dc-group-call-modal');
                        const membersList = document.getElementById('dc-group-call-members');
                        membersList.innerHTML = '';
                        
                        const chat = ds.chats[ds.activeChat];
                        if(!chat || chat.type !== 'group') return;
                        
                        let onlineCount = 0;
                        
                        chat.members.forEach(memberId => {
                            const isOnline = memberId === ds.peer.id || ds.connections[memberId];
                            const memberChat = Object.values(ds.chats).find(c => 
                                c.type === 'dm' && c.members.includes(memberId)
                            );
                            const memberName = memberChat ? memberChat.name : `User_${memberId.substring(0, 4)}`;
                            
                            const memberDiv = document.createElement('div');
                            memberDiv.className = 'dc-group-member';
                            memberDiv.innerHTML = `
                                <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
                                    <div style="display:flex; align-items:center; gap:10px;">
                                        <div class="dc-avatar-small" style="width:24px; height:24px; background:${memberChat ? memberChat.color : '#7289da'};"></div>
